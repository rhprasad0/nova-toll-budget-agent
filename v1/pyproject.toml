[project]
name = "tollchat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aws-opentelemetry-distro>=0.18.0,<1",
    "bedrock-agentcore>=1.21.0,<2",
    "boto3>=1.43.70",
    "defusedxml>=0.7.1",
    "openai>=2.53.0,<3",
    "strands-agents[openai]==1.51.0",
    # AgentCore's official packager falls back to manylinux_2_28 for ARM64
    # dependencies when a package no longer publishes a manylinux2014 wheel.
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pyyaml",
    "strands-agents-evals>=1.1.1",
    "strands-agents-sops>=1.1.3",
]

[tool.pytest.ini_options]
# "live" tests hit an LLM API, the network, or RDS directly --
# excluded by default so CI's bare `pytest` never runs them. Run explicitly with -m live.
markers = ["live: hits the network and RDS; run explicitly with -m live"]
addopts = '-m "not live"'
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# infra/build/ holds vendored deps (psycopg) assembled into the Lambda zip by
# scripts/build_zips.sh — not our code, and gitignored. Don't type-check it.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/tests",
    ".venv",
    "infra/build",
    "tests",
]

[tool.ruff]
extend-exclude = ["infra/build"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "BLE",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["ANN"]
"tests/*.py" = ["ANN"]
