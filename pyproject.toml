[project]
name = "nova-toll-budget-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.53",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "psycopg[binary]",
]

[tool.pytest.ini_options]
# "live" tests hit the network and RDS directly (tests/test_expresslanes_crosscheck.py) --
# excluded by default so CI's bare `pytest` never runs them. Run explicitly with -m live.
markers = ["live: hits the network and RDS; run explicitly with -m live"]
addopts = '-m "not live"'

[tool.pyright]
# infra/build/ holds vendored deps (psycopg) assembled into the Lambda zip by
# scripts/build_zips.sh — not our code, and gitignored. Don't type-check it.
exclude = ["**/node_modules", "**/__pycache__", ".venv", "infra/build"]

[[tool.pyright.executionEnvironments]]
root = "."

[tool.ruff]
extend-exclude = ["infra/build"]
