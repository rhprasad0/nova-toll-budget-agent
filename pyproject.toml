[project]
name = "tollchat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.53",
    "defusedxml>=0.7.1",
    "strands-agents>=1.50.1",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
]

[tool.pytest.ini_options]
# "live" tests hit the network and RDS directly (tests/test_expresslanes_crosscheck.py) --
# excluded by default so CI's bare `pytest` never runs them. Run explicitly with -m live.
markers = ["live: hits the network and RDS; run explicitly with -m live"]
addopts = '-m "not live"'

[tool.pyright]
# infra/build/ holds vendored deps (psycopg) assembled into the Lambda zip by
# scripts/build_zips.sh — not our code, and gitignored. Don't type-check it.
exclude = ["**/node_modules", "**/__pycache__", ".venv", "infra/build"]

# agent/toll_agent.py and tests/* sys.path-insert their way to these flat
# (no __init__.py) sibling dirs at runtime -- pyright can't see that, so it
# needs the same dirs here to resolve the imports statically.
[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["agent_tools", "agent"]

[tool.ruff]
extend-exclude = ["infra/build"]
