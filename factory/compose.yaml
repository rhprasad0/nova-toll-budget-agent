name: factory

networks:
  internal:
    name: factory-internal
    internal: true # no route out: the proxy is the only way off this network
  egress:
    name: factory-egress
  trace:
    name: factory-trace
    enable_ipv6: true

services:
  proxy:
    build: ./proxy
    image: factory-proxy:dev
    # host/test_proxy.py runs this exact command.
    command:
      - mitmdump
      - --set
      - rawtcp=false
      - --mode
      - regular@8080
      - --mode
      - reverse:http://collector:4318@4318
      - -s
      - /addon/allowlist.py
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # Owned by uid 1000, the user the proxy image runs as (see proxy/Dockerfile).
      - ${HOME}/.local/state/factory/certs:/home/mitmproxy/.mitmproxy
      # Only the flow log and the job tag: never the host-only git clone.
      - ${HOME}/.local/state/factory/flows:/state/flows
      - ${HOME}/.local/state/factory/current-job:/state/current-job:ro
    networks: [internal, egress]
    restart: unless-stopped

  trace-netns:
    image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: ["sleep", "infinity"]
    init: true
    networks:
      egress:
        aliases: [collector]
      trace: {}
    ports:
      - 127.0.0.1:6006:6006
      - 127.0.0.1:4318:4318
      - 10.249.0.1:15432:6432
      - 10.249.0.1:15433:6433
      - 10.249.0.1:15434:6434
    extra_hosts:
      - "${FACTORY_RDS_HOST:?}=${FACTORY_RDS_ADDR:?}"
    restart: unless-stopped

  aws-credentials:
    image: public.ecr.aws/rolesanywhere/credential-helper:1.8.6-2026.11.04.18.00@sha256:8f366a68499d06097d0ddb78f882298f17997eeb7171fc3f5e59ebc8c58ec46a
    network_mode: service:trace-netns
    depends_on: [trace-netns]
    user: "1000:1000"
    command:
      - serve
      - --certificate=/certs/factory.pem
      - --private-key=/certs/factory.key
      - --trust-anchor-arn=${FACTORY_TRUST_ANCHOR_ARN:?}
      - --profile-arn=${FACTORY_PROFILE_ARN:?}
      - --role-arn=${FACTORY_ROLE_ARN:?}
    volumes:
      - ${HOME}/.config/factory/roles-anywhere:/certs:ro
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    network_mode: service:trace-netns
    depends_on: [trace-netns, aws-credentials]
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix_factory@${FACTORY_RDS_HOST:?}:5432/phoenix?sslmode=verify-full&sslrootcert=/rds/rds-ca.pem
      PHOENIX_POSTGRES_USE_AWS_IAM_AUTH: "true"
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"
      PHOENIX_AGENTS_DISABLE_BASH: "true"
      PHOENIX_AGENTS_DISABLE_WEB_ACCESS: "true"
      PHOENIX_AGENTS_DISABLE_GITHUB: "true"
      PHOENIX_ALLOWED_SANDBOX_PROVIDERS: NONE
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ENABLE_MCP_SERVER: "false"
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"
    volumes:
      - ${HOME}/.local/state/factory/rds-ca.pem:/rds/rds-ca.pem:ro
    restart: unless-stopped

  relay: &relay
    build: ./relay
    image: factory-relay:dev
    network_mode: service:trace-netns
    depends_on: [trace-netns, aws-credentials]
    environment:
      FACTORY_RDS_HOST: ${FACTORY_RDS_HOST:?}
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
      RELAY_USER: factory_sandbox
      RELAY_PORT: "6432"
      RELAY_CONNECTIONS: "15"
    volumes:
      - ${HOME}/.local/state/factory/rds-ca.pem:/rds/rds-ca.pem:ro
    restart: unless-stopped

  relay-read:
    <<: *relay
    environment:
      FACTORY_RDS_HOST: ${FACTORY_RDS_HOST:?}
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
      RELAY_USER: factory_sandbox_reader
      RELAY_PORT: "6433"
      RELAY_CONNECTIONS: "5"

  relay-chaos-lab:
    <<: *relay
    environment:
      FACTORY_RDS_HOST: ${FACTORY_RDS_HOST:?}
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
      RELAY_USER: chaos_lab
      RELAY_DATABASE: chaos_lab
      RELAY_PORT: "6434"
      RELAY_CONNECTIONS: "8"

  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    network_mode: service:trace-netns
    depends_on: [trace-netns, aws-credentials]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
      FACTORY_TRACES_BUCKET: ${FACTORY_TRACES_BUCKET:?}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
