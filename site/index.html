<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TollChat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0f14;
    color: #e6e9ef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  main { max-width: 32rem; }
  h1 {
    font-size: 2.25rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  p.tagline {
    font-size: 1.1rem;
    color: #9aa4b2;
    margin: 0 0 2rem;
  }
  p.status {
    font-size: 0.95rem;
    color: #6b7686;
    margin: 0 0 1.5rem;
  }
  p.links {
    font-size: 0.95rem;
    margin: 0;
  }
  a {
    color: #7dd3fc;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>TollChat</h1>
  <p class="tagline">Ask what your trip costs on Northern Virginia's toll roads.</p>
  <p class="status">Coming soon.</p>
  <p class="links"><a href="mailto:contact@tollchat.ai">contact@tollchat.ai</a> &middot; <a href="https://github.com/rhprasad0/nova-toll-budget-agent">GitHub</a></p>
</main>
</body>
</html>
