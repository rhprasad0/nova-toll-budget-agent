[project]
name = "tollchat-multiagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.67",
    "openai>=2.45.0,<3",
    "psycopg[binary]==3.2.13",
    "pydantic>=2.13,<3",
    "strands-agents[openai]==1.51.0",
]

[dependency-groups]
dev = ["pyright", "pytest", "ruff"]

[tool.pytest.ini_options]
markers = ["live: hits the network, RDS, or an LLM API"]
addopts = '-m "not live"'
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = ["**/__pycache__", ".venv", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "BLE",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN"]
