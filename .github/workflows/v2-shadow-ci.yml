name: shadow-ci

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: shadow-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'merge_group' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      python: ${{ steps.prepare.outputs.python }}
      runner: ${{ steps.prepare.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
      - run: uv sync --locked
        working-directory: v2
      - id: prepare
        working-directory: v2
        run: |
          uv run python -m eval.shadow_ci prepare >"$RUNNER_TEMP/shadow-readiness.json"
          jq -r '"ready=\(.ready)", "python=\(.python // "")", "runner=\(.runner // "")"' \
            "$RUNNER_TEMP/shadow-readiness.json" >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/shadow-readiness.json"

  evaluate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/v2-shadow-eval.yml
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      python_version: ${{ needs.prepare.outputs.python }}
      runner: ${{ needs.prepare.outputs.runner }}
    permissions:
      contents: read
      id-token: write
