name: v2 timed live checks

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      window_id:
        description: Timed window to verify against the live system
        required: true
        type: choice
        options:
          - i95_northbound
          - i95_reversal
          - i95_southbound
          - greenway_eb_peak
          - greenway_wb_peak

concurrency:
  group: v2-timed-live-${{ inputs.window_id }}
  cancel-in-progress: false

jobs:
  live-checks:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/v2-timed-checks.yml
    with:
      schedule: ""
      window_id: ${{ inputs.window_id }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
