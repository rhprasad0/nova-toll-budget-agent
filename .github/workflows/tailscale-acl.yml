name: tailscale-acl
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: ["policy.hujson"]
  pull_request:
    branches: ["main"]
    paths: ["policy.hujson"]

jobs:
  acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test ACL
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ secrets.TS_ACL_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_ACL_OAUTH_SECRET }}
          tailnet: rhprasad0.github
          action: test
      - name: Deploy ACL
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ secrets.TS_ACL_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_ACL_OAUTH_SECRET }}
          tailnet: rhprasad0.github
          action: apply
