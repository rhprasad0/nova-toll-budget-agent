name: v2-shadow-eval

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      python_version:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Bind the PR candidate and calibrated runtime
        working-directory: .
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = pull_request
          test "$ACTOR_ID" = 91573985
          test "$WORKFLOW_REF" = "$EVENT_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
          test "$EVENT_REPOSITORY" = rhprasad0/nova-toll-budget-agent
          test "$HEAD_REPOSITORY" = "$EVENT_REPOSITORY"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_SHA" = "$EVENT_SHA"
          [[ "$PYTHON_VERSION" =~ ^3\.13\.[0-9]+$ ]]
          case "$RUNNER_LABEL" in ubuntu-latest|ubuntu-24.04-arm) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ inputs.python_version }}
      - run: uv sync --locked
      - name: Verify harness approval before credentials
        run: uv run python -m eval.shadow_ci prepare --verify-runtime
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-shadow-eval-dev
          aws-region: us-east-1
          allowed-account-ids: '903859731897'
          role-duration-seconds: 900
      - name: Evaluate all ten shadow cases once
        run: >-
          uv run python -m eval.golden_run run
          --corpus eval/active/shadow --calibration eval/harness-approval.json
          --output "$RUNNER_TEMP/shadow-run" --budget-usd 2 --trials-per-case 1
      - name: Report shadow results
        if: always()
        working-directory: .
        run: |
          if [[ -f "$RUNNER_TEMP/shadow-run/manifest.json" ]] &&
            uv run --directory v2 python -m eval.shadow_ci report --output "$RUNNER_TEMP/shadow-run" \
              >"$RUNNER_TEMP/shadow-score.json"; then
            cat "$RUNNER_TEMP/shadow-score.json"
            jq -r '"Candidate \(.source_commit): shadow \(.passed)/\(.expected_trials) passed (\(.pass_rate * 100)%); \(.scored_trials) scored, \(.inconclusive_trials) inconclusive; complete=\(.complete); accounted cost $\(.cost_usd). Informational only."' \
              "$RUNNER_TEMP/shadow-score.json" >>"$GITHUB_STEP_SUMMARY"
            if [[ "$(jq -r .complete "$RUNNER_TEMP/shadow-score.json")" != true ]]; then
              echo '::warning::Shadow evaluation has incomplete measurements; see the summary and logs.'
            fi
          else
            echo 'Shadow evaluation did not produce a usable report. See the job logs; no score is available. This diagnostic is informational.' >>"$GITHUB_STEP_SUMMARY"
            echo '::warning::Shadow evaluation did not produce a usable report.'
          fi
