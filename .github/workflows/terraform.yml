name: terraform
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      [
        "infra/**",
        "scripts/build_zips.sh",
        "scripts/loader-requirements.txt",
        "lambdas/**",
        "site/**",
      ]
  pull_request:
    paths:
      [
        "infra/**",
        "scripts/build_zips.sh",
        "scripts/loader-requirements.txt",
        "lambdas/**",
        "site/**",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    # Credential-free, so every PR gets basic infrastructure feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra

  apply:
    needs: fmt-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./scripts/build_zips.sh
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-terraform-apply
          aws-region: us-east-1
      - name: Fetch Cloudflare token
        run: |
          TOKEN=$(aws ssm get-parameter --name /nova-toll/cloudflare-api-token --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init
        working-directory: infra
      - run: |
          terraform apply -auto-approve \
            -var fetcher_package_path=build/fetcher.zip \
            -var loader_package_path=build/loader.zip
        working-directory: infra
