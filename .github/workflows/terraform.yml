name: terraform
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: ["infra/**", "infra/delivery_plan_validator.py", "infra/test_delivery_plan_validator.py", "v2/infra/**", "v2/tests/test_infrastructure_contract.py", ".github/workflows/terraform.yml", ".github/workflows/v2-production-plan.yml", ".github/workflows/v2-development-plan.yml", ".github/workflows/v2-development-delivery.yml"]
  pull_request:
    paths: ["infra/**", "infra/delivery_plan_validator.py", "infra/test_delivery_plan_validator.py", "v2/infra/**", "v2/tests/test_infrastructure_contract.py", ".github/workflows/terraform.yml", ".github/workflows/v2-production-plan.yml", ".github/workflows/v2-development-plan.yml", ".github/workflows/v2-development-delivery.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -input=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      - run: terraform fmt -check -recursive
        working-directory: v2/infra
      - run: terraform init -backend=false -input=false
        working-directory: v2/infra
      - run: terraform validate
        working-directory: v2/infra
      - run: python3 -m unittest infra.test_delivery_plan_validator
      - run: python3 infra/test_delivery_identities.py
