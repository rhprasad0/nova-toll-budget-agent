name: terraform
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      [
        "infra/**",
        "scripts/build_zips.sh",
        "scripts/loader-requirements.txt",
        "lambdas/**",
      ]
  pull_request:
    paths:
      [
        "infra/**",
        "scripts/build_zips.sh",
        "scripts/loader-requirements.txt",
        "lambdas/**",
      ]

jobs:
  fmt-validate:
    # Credential-free, so fork PRs still get basic infra feedback even
    # though the `plan` job below is skipped for them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra

  plan:
    needs: fmt-validate
    runs-on: ubuntu-latest
    # Skip PRs from forks -- same reasoning as the `integration` job in
    # ci.yml: a fork PR gets the same `pull_request` sub claim as a
    # same-repo PR, so this check (not the trust policy) is what actually
    # keeps a fork from assuming nova-toll-terraform-plan.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./scripts/build_zips.sh
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-terraform-plan
          aws-region: us-east-1
      - name: Fetch Cloudflare token
        run: |
          TOKEN=$(aws ssm get-parameter --name /nova-toll/cloudflare-api-token --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init
        working-directory: infra
      - run: |
          terraform plan -lock=false \
            -var fetcher_package_path=build/fetcher.zip \
            -var loader_package_path=build/loader.zip \
            -var express_fetcher_package_path=build/express-fetcher.zip
        working-directory: infra

  apply:
    needs: fmt-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./scripts/build_zips.sh
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-terraform-apply
          aws-region: us-east-1
      - name: Fetch Cloudflare token
        run: |
          TOKEN=$(aws ssm get-parameter --name /nova-toll/cloudflare-api-token --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init
        working-directory: infra
      - run: |
          terraform apply -auto-approve \
            -var fetcher_package_path=build/fetcher.zip \
            -var loader_package_path=build/loader.zip \
            -var express_fetcher_package_path=build/express-fetcher.zip
        working-directory: infra
