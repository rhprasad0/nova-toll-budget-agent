name: terraform
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      [
        "infra/**",
        ".github/workflows/terraform.yml",
        "scripts/build_zips.sh",
        "scripts/loader-requirements.txt",
        "agent/**",
        "agent_tools/**",
        "agent-sops/**",
        "oracles/**",
        "pyproject.toml",
        "uv.lock",
        "lambdas/**",
        "site/**",
        "docs/legal/**",
      ]
  pull_request:
    paths:
      [
        "infra/**",
        ".github/workflows/terraform.yml",
        "scripts/build_zips.sh",
        "scripts/loader-requirements.txt",
        "agent/**",
        "agent_tools/**",
        "agent-sops/**",
        "oracles/**",
        "pyproject.toml",
        "uv.lock",
        "lambdas/**",
        "site/**",
        "docs/legal/**",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    # Credential-free, so every PR gets basic infrastructure feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra

  apply:
    needs: fmt-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: ./scripts/build_zips.sh
      - name: Record reviewed package digests
        run: |
          cd infra/build
          cp ../../site/preview.html ../../site/preview.mjs ../../site/faq.html .
          cp ../../docs/legal/privacy.md ../../docs/legal/terms.md .
          sha256sum agentcore.zip chat-proxy.zip fetcher.zip loader.zip \
            preview.html preview.mjs faq.html privacy.md terms.md > SHA256SUMS
          REVIEWED_RELEASE="${GITHUB_SHA}/$(sha256sum SHA256SUMS | cut -d ' ' -f1)"
          echo "REVIEWED_RELEASE=$REVIEWED_RELEASE" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-terraform-apply
          aws-region: us-east-1
      - name: Stage reviewed packages
        run: |
          verification_dir="$(mktemp -d)"
          trap 'rm -r -- "$verification_dir"' EXIT
          for artifact in agentcore.zip chat-proxy.zip fetcher.zip loader.zip preview.html preview.mjs faq.html privacy.md terms.md SHA256SUMS; do
            aws s3 cp "infra/build/$artifact" \
              "s3://nova-toll-agentcore-920534282028/reviewed/$REVIEWED_RELEASE/$artifact" \
              --checksum-algorithm SHA256 --only-show-errors
          done
          for artifact in agentcore.zip chat-proxy.zip fetcher.zip loader.zip preview.html preview.mjs faq.html privacy.md terms.md SHA256SUMS; do
            aws s3 cp \
              "s3://nova-toll-agentcore-920534282028/reviewed/$REVIEWED_RELEASE/$artifact" \
              "$verification_dir/$artifact" \
              --checksum-mode ENABLED --only-show-errors
          done
          (cd "$verification_dir" && sha256sum --check SHA256SUMS)
      - name: Fetch Cloudflare token
        run: |
          TOKEN=$(aws ssm get-parameter --name /nova-toll/cloudflare-api-token --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init
        working-directory: infra
      - run: |
          terraform apply -auto-approve \
            -var fetcher_package_path=build/fetcher.zip \
            -var loader_package_path=build/loader.zip \
            -var agentcore_package_path=build/agentcore.zip \
            -var chat_proxy_package_path=build/chat-proxy.zip \
            -var enable_public_chat=true
        working-directory: infra
      - name: Publish reviewed release
        run: |
          printf 'Reviewed release: `%s`\n' "$REVIEWED_RELEASE" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$REVIEWED_RELEASE" > infra/build/latest
          aws s3 cp infra/build/latest \
            s3://nova-toll-agentcore-920534282028/reviewed/latest \
            --checksum-algorithm SHA256 --only-show-errors
