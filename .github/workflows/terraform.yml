name: terraform
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rhprasad0/nova-toll-budget-agent/toolchain@sha256:55f9efde563122cda78c9fdba2b385aef1db7e2e732d404f4d5570e879fa6e6f
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reuse providers within this job
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-provider-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-provider-cache" >> "$GITHUB_ENV"
      - run: .github/scripts/verify.sh terraform
