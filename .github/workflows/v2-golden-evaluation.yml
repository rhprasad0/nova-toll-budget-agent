name: v2-golden-evaluation
on:
  workflow_dispatch:
    inputs:
      development_run:
        description: Successful development delivery run for the evaluated artifact
        type: string
        required: true
      summary_sha256:
        description: SHA-256 of the signed aggregate envelope in the fixed inbox
        type: string
        required: true
      summary_version:
        description: Exact S3 version ID of the signed aggregate envelope
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: golden-summary-import
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'rhprasad0/nova-toll-budget-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: golden-evaluation
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-golden-evaluator
          aws-region: us-east-1
          allowed-account-ids: '903859731897'
      - name: Verify delivery and import signed aggregate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPMENT_RUN: ${{ inputs.development_run }}
          SUMMARY_SHA256: ${{ inputs.summary_sha256 }}
          SUMMARY_VERSION: ${{ inputs.summary_version }}
        run: |
          set -euo pipefail
          cd v2
          python3 -m scripts.golden_release resolve --development-run "$DEVELOPMENT_RUN" --directory "$RUNNER_TEMP/resolved"
          python3 -m scripts.golden_release import --context "$RUNNER_TEMP/resolved/context.json" --summary-sha256 "$SUMMARY_SHA256" --summary-version "$SUMMARY_VERSION" --directory "$RUNNER_TEMP/golden"
      - name: Retain validated aggregate evidence, including failed qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: golden-evidence-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/golden/summary-envelope.json
            ${{ runner.temp }}/golden/prepared.json
            ${{ runner.temp }}/golden/decision.json
            ${{ runner.temp }}/golden/review.md
          if-no-files-found: warn
          retention-days: 90
      - name: Publish honest aggregate results
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/golden/review.md"; then
            cat "$RUNNER_TEMP/golden/review.md" >>"$GITHUB_STEP_SUMMARY"
          fi
  approve:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: golden-review
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download aggregate review packet for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "golden-evidence-$GITHUB_RUN_ID-1" --dir "$RUNNER_TEMP/golden"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-golden-reviewer
          aws-region: us-east-1
          allowed-account-ids: '903859731897'
      - name: Reverify signature and bind actual human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd v2
          python3 -m scripts.golden_release approve --directory "$RUNNER_TEMP/golden"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: golden-decision-${{ github.run_id }}-1
          path: ${{ runner.temp }}/golden/receipt.json
          if-no-files-found: error
          retention-days: 90
