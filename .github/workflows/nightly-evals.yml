name: nightly-evals

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: nightly-evals

jobs:
  simulated-user:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clear curated evaluation reports
        run: rm -f eval/results/*.json
      - name: Fetch RDS CA bundle
        run: |
          mkdir -p infra/build/loader
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o infra/build/loader/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  infra/build/loader/rds-ca-bundle.pem" | sha256sum --check --status
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-github-nightly-eval
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Run every evaluation suite
        run: |
          failed=0
          uv run --frozen python eval/deterministic/fuzzy_location_matching/deterministic_fuzzy_location_matching.py || failed=1
          uv run --frozen python eval/deterministic/ny_time_us_format/deterministic_ny_time_us_format.py || failed=1
          uv run --frozen python eval/deterministic/i95_historical_closures/deterministic_i95_historical_closures.py || failed=1
          NOVA_TOLL_EVAL_MODEL_ID="$(aws ssm get-parameter --name /nova-toll/nightly_eval_bedrock_profile_arn --query Parameter.Value --output text)" uv run --frozen python eval/simulated/simulated_user_i95_one_way_access.py || failed=1
          NOVA_TOLL_EVAL_MODEL_ID="$(aws ssm get-parameter --name /nova-toll/nightly_eval_bedrock_profile_arn --query Parameter.Value --output text)" uv run --frozen python eval/simulated/simulated_user_fuzzy_location_matching.py || failed=1
          NOVA_TOLL_EVAL_MODEL_ID="$(aws ssm get-parameter --name /nova-toll/nightly_eval_bedrock_profile_arn --query Parameter.Value --output text)" uv run --frozen python eval/simulated/simulated_user_ny_time_us_format.py || failed=1
          NOVA_TOLL_EVAL_MODEL_ID="$(aws ssm get-parameter --name /nova-toll/nightly_eval_bedrock_profile_arn --query Parameter.Value --output text)" uv run --frozen python eval/simulated/simulated_user_i95_historical_closures.py || failed=1
          NOVA_TOLL_EVAL_MODEL_ID="$(aws ssm get-parameter --name /nova-toll/nightly_eval_bedrock_profile_arn --query Parameter.Value --output text)" uv run --frozen python eval/simulated/simulated_user_single_leg_base_cases.py || failed=1
          exit "$failed"
      - name: Save evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/results/*.json
          if-no-files-found: ignore
          retention-days: 90
