name: v2-production-plan
'on':
  workflow_run:
    workflows:
    - v2-production-release
    types:
    - completed
permissions:
  contents: read
concurrency:
  group: v2-production-release-delivery
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  EXPECTED_ACCOUNT: '920534282028'
  PLAN_BUCKET: nova-toll-tfstate-920534282028
  TFSTATE_KMS_KEY_ARN: arn:aws:kms:us-east-1:920534282028:key/8fc1450b-0b5c-4afe-8c0a-cb150aab5da7
jobs:
  admission:
    if: github.repository == 'rhprasad0/nova-toll-budget-agent' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      admission: ${{ steps.admit.outputs.admission }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: admit
      name: Verify release, development evidence, and immutable artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        LISTENER_RUN: ${{ github.event.workflow_run.id }}
      run: |
        set -euo pipefail
        umask 077
        set +x
        source v2/scripts/run_private_stage.sh
        PRIVATE_STAGE_REPORTED=0
        PRIVATE_STAGE_SUMMARY_FAILED=0
        PRIVATE_STAGE_FALLBACK_STAGE=release-status
        step_exit() {
          local status=$?
          trap - EXIT
          if (( status != 0 && PRIVATE_STAGE_REPORTED == 0 )); then
            _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
          fi
          exit "$status"
        }
        trap step_exit EXIT
        result="$RUNNER_TEMP/production-admission.json"
        run_private_stage release-verification "$RUNNER_TEMP/production-admission.out" "$RUNNER_TEMP/production-admission.err" python3 v2/scripts/check_production_release.py admit --event-file "$GITHUB_EVENT_PATH" --listener-run "$LISTENER_RUN" --consumer-run "$GITHUB_RUN_ID" --consumer-attempt "$GITHUB_RUN_ATTEMPT" --output "$result"
        publish_output() {
          local value
          value="$(jq -c . "$result")" || return
          printf 'admission=%s\n' "$value" >>"$GITHUB_OUTPUT" || return
        }
        run_private_stage release-status "$RUNNER_TEMP/production-output.out" "$RUNNER_TEMP/production-output.err" publish_output
        rm -f -- "$result"
  claim:
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      admission: ${{ steps.claim.outputs.admission }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: claim
      name: Record one durable release claim
      env:
        GH_TOKEN: ${{ github.token }}
        ADMISSION: ${{ needs.admission.outputs.admission }}
      run: |
        set -euo pipefail
        umask 077
        set +x
        source v2/scripts/run_private_stage.sh
        PRIVATE_STAGE_REPORTED=0
        PRIVATE_STAGE_SUMMARY_FAILED=0
        PRIVATE_STAGE_FALLBACK_STAGE=release-status
        step_exit() {
          local status=$?
          trap - EXIT
          if (( status != 0 && PRIVATE_STAGE_REPORTED == 0 )); then
            _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
          fi
          exit "$status"
        }
        trap step_exit EXIT
        input="$RUNNER_TEMP/admission.json"; result="$RUNNER_TEMP/claim.json"
        printf '%s' "$ADMISSION" >"$input"
        run_private_stage release-status "$RUNNER_TEMP/production-claim.out" "$RUNNER_TEMP/production-claim.err" python3 v2/scripts/check_production_release.py claim --admission "$input" --output "$result"
        publish_output() {
          local value
          value="$(jq -c . "$result")" || return
          printf 'admission=%s\n' "$value" >>"$GITHUB_OUTPUT" || return
        }
        run_private_stage release-status "$RUNNER_TEMP/production-output.out" "$RUNNER_TEMP/production-output.err" publish_output
        rm -f -- "$input" "$result"
  planner:
    needs: claim
    if: needs.claim.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: trusted
        persist-credentials: false
    - id: admitted
      env:
        ADMISSION: ${{ needs.claim.outputs.admission }}
      run: |
        set -euo pipefail
        umask 077
        set +x
        source trusted/v2/scripts/run_private_stage.sh
        PRIVATE_STAGE_REPORTED=0
        PRIVATE_STAGE_SUMMARY_FAILED=0
        PRIVATE_STAGE_FALLBACK_STAGE=release-status
        step_exit() {
          local status=$?
          trap - EXIT
          if (( status != 0 && PRIVATE_STAGE_REPORTED == 0 )); then
            _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
          fi
          exit "$status"
        }
        trap step_exit EXIT

        bind_admission() {
          printf '%s' "$ADMISSION" | jq -e 'select(type == "object" and (.release_id|type == "number") and (.tag|test("^v[0-9]+(\\.[0-9]+){2}$")) and (.candidate|test("^[0-9a-f]{40}$")) and (.bundle_id|type == "number") and (.bundle_digest|test("^sha256:[0-9a-f]{64}$")) and (.schema_versions|keys == ["oracle", "pricing"]) and (.claim_id|type == "number"))' >"$RUNNER_TEMP/admission.json" || return
          jq -r 'to_entries[] | "\(.key)=\(.value|if type == "object" then @json else . end)"' "$RUNNER_TEMP/admission.json" >>"$GITHUB_OUTPUT" || return
        }
        run_private_stage release-verification "$RUNNER_TEMP/production-bind.out" "$RUNNER_TEMP/production-bind.err" bind_admission
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.admitted.outputs.candidate }}
        path: candidate
        persist-credentials: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.5
        checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
        python-version: '3.13'
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_wrapper: false
        terraform_version: 1.15.8
    - name: Verify exact candidate bundle before OIDC
      env:
        GH_TOKEN: ${{ github.token }}
        BUNDLE_ID: ${{ steps.admitted.outputs.bundle_id }}
        BUNDLE_DIGEST: ${{ steps.admitted.outputs.bundle_digest }}
        LISTENER_RUN: ${{ steps.admitted.outputs.listener_run }}
        LISTENER_ATTEMPT: ${{ steps.admitted.outputs.listener_attempt }}
        DEVELOPMENT_RUN: ${{ steps.admitted.outputs.development_run }}
        DEVELOPMENT_ATTEMPT: ${{ steps.admitted.outputs.development_attempt }}
        DEVELOPMENT_DEPLOYMENT: ${{ steps.admitted.outputs.development_deployment }}
        EVIDENCE_ARTIFACT: ${{ fromJSON(steps.admitted.outputs.evidence_artifact).id }}
        EVIDENCE_DIGEST: ${{ fromJSON(steps.admitted.outputs.evidence_artifact).digest }}
        CANDIDATE: ${{ steps.admitted.outputs.candidate }}
        PRICING: ${{ fromJSON(steps.admitted.outputs.schema_versions).pricing }}
        ORACLE: ${{ fromJSON(steps.admitted.outputs.schema_versions).oracle }}
      run: |
        set -euo pipefail
        umask 077
        set +x
        bundle="$RUNNER_TEMP/production-release.zip"; overlay="$RUNNER_TEMP/production-release-overlay"
        source trusted/v2/scripts/run_private_stage.sh
        PRIVATE_STAGE_REPORTED=0
        PRIVATE_STAGE_SUMMARY_FAILED=0
        PRIVATE_STAGE_FALLBACK_STAGE=release-status
        step_exit() {
          local status=$?
          trap - EXIT
          if (( status != 0 && PRIVATE_STAGE_REPORTED == 0 )); then
            _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
          fi
          exit "$status"
        }
        trap step_exit EXIT
        verify_bundle() {
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUNDLE_ID/zip" | dd of="$bundle" bs=1048576 count=513 iflag=fullblock status=none || return
          test "$(stat -c %s "$bundle")" -le 536870912 || return
          test "sha256:$(sha256sum "$bundle" | awk '{print $1}')" = "$BUNDLE_DIGEST" || return
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); sizes=[item.file_size for item in z.infolist()]; raise SystemExit(not sizes or max(sizes)>268435456 or sum(sizes)>536870912)' "$bundle" || return
          python3 trusted/v2/scripts/verify_release_bundle.py verify --archive "$bundle" --output "$overlay" --root "$GITHUB_WORKSPACE/candidate" --expected-digest "$BUNDLE_DIGEST" --commit "$CANDIDATE" --pricing-version "$PRICING" --oracle-version "$ORACLE" --verify-checkout || return
          cp -a -- "$overlay/v2/agent/." "$GITHUB_WORKSPACE/candidate/v2/agent/" || return
          cp -- "$overlay/v2/analytics/agent_registry.ndjson" "$GITHUB_WORKSPACE/candidate/v2/analytics/agent_registry.ndjson" || return
        }
        run_private_stage artifact-download "$RUNNER_TEMP/production-bundle.out" "$RUNNER_TEMP/production-bundle.err" verify_bundle
    - name: Revalidate mutable release evidence before OIDC
      env:
        GH_TOKEN: ${{ github.token }}
        ADMISSION: ${{ needs.claim.outputs.admission }}
      run: |
        set -euo pipefail
        umask 077
        set +x
        source trusted/v2/scripts/run_private_stage.sh
        PRIVATE_STAGE_REPORTED=0
        PRIVATE_STAGE_SUMMARY_FAILED=0
        PRIVATE_STAGE_FALLBACK_STAGE=release-status
        step_exit() {
          local status=$?
          trap - EXIT
          if (( status != 0 && PRIVATE_STAGE_REPORTED == 0 )); then
            _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
          fi
          exit "$status"
        }
        trap step_exit EXIT
        input="$RUNNER_TEMP/production-admission-revalidation.json"
        output="$RUNNER_TEMP/production-revalidated.json"
        printf '%s' "$ADMISSION" >"$input"
        run_private_stage release-verification "$RUNNER_TEMP/production-revalidation.out" "$RUNNER_TEMP/production-revalidation.err" python3 trusted/v2/scripts/check_production_release.py revalidate --admission "$input" --output "$output"
        rm -f -- "$input" "$output"
    - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
      with:
        role-to-assume: arn:aws:iam::920534282028:role/nova-toll-production-planner
        aws-region: us-east-1
    - name: Plan and save the complete application candidate
      env:
        RELEASE_ID: ${{ steps.admitted.outputs.release_id }}
        RELEASE_TAG: ${{ steps.admitted.outputs.tag }}
        CANDIDATE: ${{ steps.admitted.outputs.candidate }}
        BUNDLE_ID: ${{ steps.admitted.outputs.bundle_id }}
        BUNDLE_DIGEST: ${{ steps.admitted.outputs.bundle_digest }}
        LISTENER_RUN: ${{ steps.admitted.outputs.listener_run }}
        LISTENER_ATTEMPT: ${{ steps.admitted.outputs.listener_attempt }}
        DEVELOPMENT_RUN: ${{ steps.admitted.outputs.development_run }}
        DEVELOPMENT_ATTEMPT: ${{ steps.admitted.outputs.development_attempt }}
        DEVELOPMENT_DEPLOYMENT: ${{ steps.admitted.outputs.development_deployment }}
        EVIDENCE_ARTIFACT: ${{ fromJSON(steps.admitted.outputs.evidence_artifact).id }}
        EVIDENCE_DIGEST: ${{ fromJSON(steps.admitted.outputs.evidence_artifact).digest }}
        SCHEMA_VERSIONS: ${{ steps.admitted.outputs.schema_versions }}
        CLAIM_ID: ${{ steps.admitted.outputs.claim_id }}
      run: |
        set -euo pipefail
        umask 077
        set +x
        source trusted/v2/scripts/run_private_stage.sh
        PRIVATE_STAGE_REPORTED=0
        PRIVATE_STAGE_SUMMARY_FAILED=0
        PRIVATE_STAGE_FALLBACK_STAGE=release-status
        step_exit() {
          local status=$?
          trap - EXIT
          if (( status != 0 && PRIVATE_STAGE_REPORTED == 0 )); then
            _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
          fi
          cleanup
          exit "$status"
        }
        trap step_exit EXIT
        foundation="$RUNNER_TEMP/foundation.json"; vars="$RUNNER_TEMP/foundation.tfvars.json"; token="$RUNNER_TEMP/cloudflare-token"; account="$RUNNER_TEMP/production-account"; plan="$RUNNER_TEMP/production.tfplan"; plan_json="$RUNNER_TEMP/production.tfplan.json"; result="$RUNNER_TEMP/production-result.json"; error="$RUNNER_TEMP/production-private.err"; overlay="$RUNNER_TEMP/production-release-overlay"
        cleanup() {
          unset CLOUDFLARE_API_TOKEN
          rm -rf -- "$foundation" "$vars" "$token" "$account" "$plan" "$plan_json" "$result" "$error" "$overlay" "$RUNNER_TEMP/production-release.zip"
          rm -f -- "$RUNNER_TEMP"/production-*.out "$RUNNER_TEMP"/production-*.err "$RUNNER_TEMP/production-counts.json"
        }
        run_private_stage account-identity "$account" "$error" aws sts get-caller-identity --query Account --output text
        run_private_stage account-identity "$RUNNER_TEMP/production-account-check.out" "$error" test "$(<"$account")" = "$EXPECTED_ACCOUNT"
        run_private_stage foundation-init "$RUNNER_TEMP/production-foundation-init.out" "$error" terraform -chdir=candidate/infra init -input=false -backend-config=backend.production.hcl
        run_private_stage foundation-output "$foundation" "$error" terraform -chdir=candidate/infra output -json foundation
        run_private_stage foundation-output-validation "$RUNNER_TEMP/production-foundation-validation.out" "$error" jq -e 'type == "object" and (keys|sort) == ["agentcore_artifacts_bucket_name","agentcore_endpoint_security_group_id","agentcore_vpc_endpoint_dns_name","agentcore_vpc_endpoint_id","alerts_topic_arn","db_instance","eventbridge_endpoint_security_group_id","private_subnet_ids","raw_bucket_name","raw_kms_key_arn","rds_security_group_id","tollchat_api_vpc_endpoint_id","vpc_cidr_block","vpc_id"] and ([.vpc_id,.vpc_cidr_block,.rds_security_group_id,.agentcore_endpoint_security_group_id,.eventbridge_endpoint_security_group_id,.agentcore_vpc_endpoint_id,.agentcore_vpc_endpoint_dns_name,.tollchat_api_vpc_endpoint_id,.raw_bucket_name,.raw_kms_key_arn,.agentcore_artifacts_bucket_name,.alerts_topic_arn]|all(type == "string" and length > 0)) and (.private_subnet_ids|keys|sort == ["a","c"]) and (.db_instance|keys|sort == ["address","identifier","port","resource_id"])' "$foundation"
        run_private_stage foundation-vars "$vars" "$error" jq -n --slurpfile foundation "$foundation" '{foundation:$foundation[0]}'
        run_private_stage release-init "$RUNNER_TEMP/production-release-init.out" "$error" terraform -chdir=candidate/v2/infra init -input=false -backend-config=backend.production.hcl
        run_private_stage artifact-metadata "$token" "$error" aws ssm get-parameter --name /nova-toll/cloudflare-read-api-token --with-decryption --query Parameter.Value --output text
        CLOUDFLARE_API_TOKEN="$(<"$token")"
        run_private_stage artifact-metadata "$RUNNER_TEMP/production-token-check.out" "$error" test -n "$CLOUDFLARE_API_TOKEN"
        export CLOUDFLARE_API_TOKEN
        run_private_stage plan "$RUNNER_TEMP/production-plan.out" "$error" terraform -chdir=candidate/v2/infra plan -input=false -out="$plan" -var-file=production.tfvars -var-file="$vars" -var loader_package_path="$overlay/v2/infra/build/loader.zip" -var publisher_package_path="$overlay/v2/infra/build/publisher.zip" -var agentcore_package_path="$overlay/v2/infra/build/agentcore.zip" -var chat_proxy_package_path="$overlay/v2/infra/build/chat-proxy.zip" -var timed_checks_package_path="$overlay/v2/infra/build/timed-checks.zip"
        unset CLOUDFLARE_API_TOKEN
        run_private_stage show "$plan_json" "$error" terraform -chdir=candidate/v2/infra show -json "$plan"
        run_private_stage validator "$RUNNER_TEMP/production-counts.json" "$error" python3 trusted/v2/scripts/validate_production_plan.py --plan "$plan_json" --inventory-root trusted/v2/infra
        counts="$(<"$RUNNER_TEMP/production-counts.json")"
        local_sha="$(sha256sum "$plan" | awk '{print $1}')"; s3_sha="$(printf '%s' "$local_sha" | xxd -r -p | base64 -w0)"; key="plans/release-${RELEASE_ID}-${RELEASE_TAG}/${GITHUB_RUN_ID}/release.tfplan"
        run_private_stage artifact-metadata "$result" "$RUNNER_TEMP/production-upload.err" aws s3api put-object --bucket "$PLAN_BUCKET" --key "$key" --body "$plan" --expected-bucket-owner "$EXPECTED_ACCOUNT" --if-none-match '*' --server-side-encryption aws:kms --ssekms-key-id "$TFSTATE_KMS_KEY_ARN" --checksum-algorithm SHA256 --checksum-sha256 "$s3_sha"
        validate_upload() {
          jq -e --arg checksum "$s3_sha" --arg key "$TFSTATE_KMS_KEY_ARN" '(.VersionId|type == "string" and length > 0) and .ChecksumSHA256 == $checksum and .SSEKMSKeyId == $key and .ServerSideEncryption == "aws:kms"' "$result" >/dev/null || return
        }
        run_private_stage artifact-metadata "$RUNNER_TEMP/production-upload-validation.out" "$error" validate_upload
        publish_summary() {
          jq -n --arg release_id "$RELEASE_ID" --arg tag "$RELEASE_TAG" --arg candidate "$CANDIDATE" --arg listener_run "$LISTENER_RUN" --arg listener_attempt "$LISTENER_ATTEMPT" --arg development_run "$DEVELOPMENT_RUN" --arg development_attempt "$DEVELOPMENT_ATTEMPT" --arg development_deployment "$DEVELOPMENT_DEPLOYMENT" --arg evidence_artifact "$EVIDENCE_ARTIFACT" --arg evidence_digest "$EVIDENCE_DIGEST" --arg bundle_id "$BUNDLE_ID" --arg bundle_digest "$BUNDLE_DIGEST" --arg local_sha256 "$local_sha" --arg planner_run "$GITHUB_RUN_ID" --arg planner_attempt "$GITHUB_RUN_ATTEMPT" --arg claim_id "$CLAIM_ID" --argjson schemas "$SCHEMA_VERSIONS" --argjson counts "$counts" --slurpfile saved "$result" '{schema_version:1,release_id:$release_id,tag:$tag,candidate:$candidate,listener_run:$listener_run,listener_attempt:$listener_attempt,development_run:$development_run,development_attempt:$development_attempt,development_deployment:$development_deployment,evidence_artifact:$evidence_artifact,evidence_digest:$evidence_digest,bundle_id:$bundle_id,bundle_digest:$bundle_digest,local_sha256:$local_sha256,planner_run:$planner_run,planner_attempt:$planner_attempt,claim_id:$claim_id,schema_versions:$schemas,plan_counts:$counts,saved_plan:{bucket:"nova-toll-tfstate-920534282028",key:("plans/release-" + $release_id + "-" + $tag + "/" + $planner_run + "/release.tfplan"),version_id:$saved[0].VersionId,checksum:$saved[0].ChecksumSHA256,kms_key_arn:$saved[0].SSEKMSKeyId}}' >>"$GITHUB_STEP_SUMMARY" || return
        }
        run_private_stage release-status "$RUNNER_TEMP/production-summary.out" "$error" publish_summary
