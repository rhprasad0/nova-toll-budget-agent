name: v2-production-plan

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release identifier for the immutable saved plan
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EXPECTED_ACCOUNT: "920534282028"
  PLAN_BUCKET: nova-toll-tfstate-920534282028
  TFSTATE_KMS_KEY_ARN: arn:aws:kms:us-east-1:920534282028:key/8fc1450b-0b5c-4afe-8c0a-cb150aab5da7

jobs:
  planner:
    name: Plan production v2 release
    if: github.repository == 'rhprasad0/nova-toll-budget-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      bucket: ${{ steps.store.outputs.bucket }}
      key: ${{ steps.store.outputs.key }}
      version_id: ${{ steps.store.outputs.version_id }}
      local_sha256: ${{ steps.store.outputs.local_sha256 }}
      s3_sha256: ${{ steps.store.outputs.s3_sha256 }}
      kms_key_arn: ${{ steps.store.outputs.kms_key_arn }}
      release_id: ${{ steps.store.outputs.release_id }}
      run_id: ${{ steps.store.outputs.run_id }}
      repository: ${{ steps.store.outputs.repository }}
      commit_sha: ${{ steps.store.outputs.commit_sha }}
      account: ${{ steps.store.outputs.account }}
      region: ${{ steps.store.outputs.region }}
      resource: ${{ steps.store.outputs.resource }}
      action: ${{ steps.store.outputs.action }}
      tag_key: ${{ steps.store.outputs.tag_key }}
      tag_value: ${{ steps.store.outputs.tag_value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.8"

      - name: Validate release identifier
        id: validate
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          umask 077
          set +x
          if [[ ! "$RELEASE_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            exit 1
          fi
          printf 'release_id=%s\n' "$RELEASE_ID" >>"$GITHUB_OUTPUT"

      - name: Build deterministic v2 packages
        working-directory: v2
        run: |
          set -euo pipefail
          umask 077
          uv sync --locked
          ./scripts/build_loader_zip.sh
          ./scripts/build_publisher_zip.sh
          ./scripts/build_agentcore_zips.sh
          for package in infra/build/loader.zip infra/build/publisher.zip infra/build/agentcore.zip infra/build/chat-proxy.zip; do
            test -f "$package"
            test -s "$package"
          done

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-production-planner
          aws-region: us-east-1

      - name: Plan and store the gated release
        id: store
        env:
          RELEASE_ID: ${{ steps.validate.outputs.release_id }}
        run: |
          set -euo pipefail
          umask 077
          set +x

          FOUNDATION_OUTPUT="$RUNNER_TEMP/production-foundation-${GITHUB_RUN_ID}.json"
          FOUNDATION_OUTPUT_ERROR="$RUNNER_TEMP/production-foundation-${GITHUB_RUN_ID}.err"
          FOUNDATION_VARS="$RUNNER_TEMP/production-foundation-${GITHUB_RUN_ID}.tfvars.json"
          FOUNDATION_INIT_LOG="$RUNNER_TEMP/production-foundation-${GITHUB_RUN_ID}.init.log"
          PLAN="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.tfplan"
          PLAN_JSON="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.tfplan.json"
          PLAN_LOG="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.plan.log"
          PLAN_ERROR="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.plan.err"
          SHOW_ERROR="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.show.err"
          V2_INIT_LOG="$RUNNER_TEMP/production-v2-${GITHUB_RUN_ID}.init.log"
          SSM_ERROR="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.ssm.err"
          PUT_RESPONSE="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.put.json"
          PUT_ERROR="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.put.err"
          MANIFEST="$RUNNER_TEMP/production-${GITHUB_RUN_ID}.manifest.json"

          cleanup() {
            unset CLOUDFLARE_API_TOKEN
            rm -f -- \
              "$FOUNDATION_OUTPUT" "$FOUNDATION_OUTPUT_ERROR" "$FOUNDATION_VARS" "$FOUNDATION_INIT_LOG" \
              "$PLAN" "$PLAN_JSON" "$PLAN_LOG" "$PLAN_ERROR" "$SHOW_ERROR" "$V2_INIT_LOG" \
              "$SSM_ERROR" "$PUT_RESPONSE" "$PUT_ERROR" "$MANIFEST"
          }
          trap cleanup EXIT

          if [[ ! "$RELEASE_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            exit 1
          fi
          case "$GITHUB_RUN_ID" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          PLAN_KEY="plans/${RELEASE_ID}/${GITHUB_RUN_ID}/release.tfplan"

          ACCOUNT="$(aws sts get-caller-identity \
            --query Account --output text 2>"$FOUNDATION_OUTPUT_ERROR")"
          test "$ACCOUNT" = "$EXPECTED_ACCOUNT"

          terraform -chdir=infra init -input=false -backend-config=backend.production.hcl \
            >"$FOUNDATION_INIT_LOG" 2>&1
          terraform -chdir=infra output -json foundation \
            >"$FOUNDATION_OUTPUT" 2>"$FOUNDATION_OUTPUT_ERROR"
          jq -e '
            def exact_keys($keys): type == "object" and ((keys_unsorted | sort) == ($keys | sort));
            . as $foundation |
            exact_keys(["vpc_id", "vpc_cidr_block", "private_subnet_ids", "rds_security_group_id", "agentcore_endpoint_security_group_id", "eventbridge_endpoint_security_group_id", "agentcore_vpc_endpoint_id", "agentcore_vpc_endpoint_dns_name", "tollchat_api_vpc_endpoint_id", "raw_bucket_name", "raw_kms_key_arn", "agentcore_artifacts_bucket_name", "db_instance", "alerts_topic_arn"])
            and all(["vpc_id", "vpc_cidr_block", "rds_security_group_id", "agentcore_endpoint_security_group_id", "eventbridge_endpoint_security_group_id", "agentcore_vpc_endpoint_id", "agentcore_vpc_endpoint_dns_name", "tollchat_api_vpc_endpoint_id", "raw_bucket_name", "raw_kms_key_arn", "agentcore_artifacts_bucket_name", "alerts_topic_arn"][]; $foundation[.] | type == "string" and length > 0)
            and ($foundation.private_subnet_ids | exact_keys(["a", "c"]) and all(.[]; type == "string" and length > 0))
            and ($foundation.db_instance | exact_keys(["identifier", "resource_id", "address", "port"]) and all(["identifier", "resource_id", "address"][]; $foundation.db_instance[.] | type == "string" and length > 0) and (.port | type == "number"))
          ' "$FOUNDATION_OUTPUT" >/dev/null
          jq -n --slurpfile foundation "$FOUNDATION_OUTPUT" '{foundation: $foundation[0]}' >"$FOUNDATION_VARS"
          chmod 600 -- "$FOUNDATION_VARS"

          terraform -chdir=v2/infra init -input=false -backend-config=backend.production.hcl \
            >"$V2_INIT_LOG" 2>&1

          CLOUDFLARE_API_TOKEN="$(aws ssm get-parameter \
            --name /nova-toll/cloudflare-read-api-token --with-decryption \
            --query Parameter.Value --output text 2>"$SSM_ERROR")"
          test -n "$CLOUDFLARE_API_TOKEN"
          (
            export CLOUDFLARE_API_TOKEN
            terraform -chdir=v2/infra plan -input=false -out="$PLAN" \
              -target=aws_cloudwatch_log_group.tollchat_proxy \
              -var-file=production.tfvars \
              -var-file="$FOUNDATION_VARS" \
              -var loader_package_path=build/loader.zip \
              -var publisher_package_path=build/publisher.zip \
              -var agentcore_package_path=build/agentcore.zip \
              -var chat_proxy_package_path=build/chat-proxy.zip \
              >"$PLAN_LOG" 2>"$PLAN_ERROR"
          )
          unset CLOUDFLARE_API_TOKEN

          terraform -chdir=v2/infra show -json "$PLAN" >"$PLAN_JSON" 2>"$SHOW_ERROR"
          python3 - "$PLAN_JSON" <<'PY'
          import json
          import sys

          TARGET = "aws_cloudwatch_log_group.tollchat_proxy"
          APPROVED_TAG = ("delivery_proof", "issue-301")
          known_managed = set("""
          aws_acm_certificate.site
