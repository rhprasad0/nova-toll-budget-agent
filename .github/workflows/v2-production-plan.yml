          aws_api_gateway_integration.tollchat_proxy
          aws_api_gateway_integration.tollchat_root
          aws_api_gateway_method.tollchat_proxy
          aws_api_gateway_method.tollchat_root
          aws_api_gateway_method_settings.tollchat
