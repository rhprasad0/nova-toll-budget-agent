name: v2-development-delivery

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  admission:
    name: Admit exact main delivery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check exact CI evidence and predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          PREDECESSOR_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/development-changed-paths"
          if [[ "$PREDECESSOR_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$CANDIDATE_SHA" >"$changed_paths"
          else
            git diff --name-only "$PREDECESSOR_SHA" "$CANDIDATE_SHA" >"$changed_paths"
          fi
          python3 v2/scripts/check_development_admission.py \
            --repository "$REPOSITORY" \
            --sha "$CANDIDATE_SHA" \
            --before "$PREDECESSOR_SHA" \
            --event-file "$GITHUB_EVENT_PATH" \
            --paths-file "$changed_paths" \
            --run-id "$GITHUB_RUN_ID" \
            --timeout-seconds 900 \
            --poll-seconds 10 \
            >"$RUNNER_TEMP/development-admission.result"
          cat "$RUNNER_TEMP/development-admission.result" >>"$GITHUB_STEP_SUMMARY"

  release-record:
    name: Record exact development release
    needs: admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.record.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Create end-to-end release record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 v2/scripts/development_deployment_status.py create

  build:
    name: Build v2 deployment packages
    needs: [admission, release-record]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.release-identity.outputs.artifact_id }}
      artifact_digest: ${{ steps.release-identity.outputs.artifact_digest }}
      pricing_schema: ${{ steps.release-identity.outputs.pricing_schema }}
      oracle_schema: ${{ steps.release-identity.outputs.oracle_schema }}
    steps:
      - name: Reject retained exact release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/release-artifacts.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-development-release-$GITHUB_SHA&per_page=100" \
            >"$metadata"
          if ! jq -e 'type == "object" and (.artifacts | type == "array")' "$metadata" >/dev/null; then
            echo "release artifact metadata malformed" >&2
            exit 1
          fi
          if jq -e --arg name "v2-development-release-$GITHUB_SHA" \
            '.artifacts | any(.[]; .name == $name and .expired == false)' \
            "$metadata" >/dev/null; then
            echo "exact release artifact is already retained; rerun failed deploy jobs" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          python-version: "3.13"

      - name: Build reviewed deployment packages
        working-directory: v2
        run: |
          set -euo pipefail
          ./scripts/build_release_bundle.sh

      - name: Prepare immutable release evidence inputs
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$GITHUB_WORKSPACE/trusted-build"
          test -f v2/infra/build/DEPLOYMENT_SHA256SUMS && test ! -L v2/infra/build/DEPLOYMENT_SHA256SUMS
          EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
          mkdir "$EVIDENCE_DIR"
          git show "${GITHUB_SHA}:infra/development-release-manifest.json" \
            >"$EVIDENCE_DIR/development-release-manifest.json"
          cp -P -- v2/infra/build/DEPLOYMENT_SHA256SUMS "$EVIDENCE_DIR/"

      - name: Checkout trusted manifest verifier after package build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: trusted-build
          persist-credentials: false

      - name: Verify reviewed manifest and write runtime evidence
        run: |
          set -euo pipefail
          umask 077
          EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
          python3 trusted-build/infra/release_manifest.py \
            --manifest "$EVIDENCE_DIR/development-release-manifest.json" \
            --package-dir v2/infra/build \
            --checksums "$EVIDENCE_DIR/DEPLOYMENT_SHA256SUMS" \
            --candidate-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --repo-root "$GITHUB_WORKSPACE" \
            --bundle-root v2/infra/build/release \
            --write-evidence "$EVIDENCE_DIR/development-release-evidence.json" \
            >"$RUNNER_TEMP/development-release-verification.json"
          jq -e '.status == "accepted" and .reason_code == "ok"' \
            "$RUNNER_TEMP/development-release-verification.json" >/dev/null

      - name: Upload immutable deployment packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-packages-${{ github.run_id }}-${{ github.sha }}
          path: |
            v2/infra/build/loader.zip
            v2/infra/build/publisher.zip
            v2/infra/build/agentcore.zip
            v2/infra/build/chat-proxy.zip
          if-no-files-found: error

      - name: Upload immutable release bundle
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-release-${{ github.sha }}
          path: v2/infra/build/release
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Upload deployment checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-checksums-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v2-development-checksums
          if-no-files-found: error

      - name: Record release identity
        id: release-identity
        env:
          RELEASE_ARTIFACT_ID: ${{ steps.upload-release.outputs.artifact-id }}
          RAW_RELEASE_ARTIFACT_DIGEST: ${{ steps.upload-release.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$RELEASE_ARTIFACT_ID" -gt 0
          if [[ "$RAW_RELEASE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            RELEASE_ARTIFACT_DIGEST="$RAW_RELEASE_ARTIFACT_DIGEST"
          elif [[ "$RAW_RELEASE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            RELEASE_ARTIFACT_DIGEST="sha256:$RAW_RELEASE_ARTIFACT_DIGEST"
          else
            echo "upload-artifact returned an invalid digest" >&2
            exit 1
          fi
          printf 'artifact_id=%s\nartifact_digest=%s\n' \
            "$RELEASE_ARTIFACT_ID" "$RELEASE_ARTIFACT_DIGEST" >>"$GITHUB_OUTPUT"
          SCHEMA_PRICING="$(jq -er '.schema_versions.pricing' v2/infra/build/release/release-manifest.json)"
          SCHEMA_ORACLE="$(jq -er '.schema_versions.oracle' v2/infra/build/release/release-manifest.json)"
          printf 'pricing_schema=%s\noracle_schema=%s\n' "$SCHEMA_PRICING" "$SCHEMA_ORACLE" >>"$GITHUB_OUTPUT"
          printf 'release_artifact_id=%s\nrelease_artifact_digest=%s\ncommit_sha=%s\npricing_schema=%s\noracle_schema=%s\n' \
            "$RELEASE_ARTIFACT_ID" "$RELEASE_ARTIFACT_DIGEST" "$GITHUB_SHA" \
            "$SCHEMA_PRICING" "$SCHEMA_ORACLE" >>"$GITHUB_STEP_SUMMARY"

      - name: Cleanup release evidence
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/v2-development-checksums" \
            "$RUNNER_TEMP/development-release-verification.json" "$GITHUB_WORKSPACE/trusted-build"

  oidc-proof:
    name: Prove protected main OIDC claims
    needs: admission
    if: github.ref == 'refs/heads/main' && needs.admission.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
    steps:
      - name: Validate runner OIDC claims
        run: |
          set +x
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            *\?*) oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" ;;
            *) oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=sts.amazonaws.com" ;;
          esac
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url")"
          oidc_token="$(jq -er '.value | strings' <<<"$oidc_response")"
          OIDC_TOKEN="$oidc_token" python3 - "$GITHUB_SHA" <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          import sys

          token = os.environ.pop("OIDC_TOKEN", "")
          expected_sha = sys.argv[1]
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "sts.amazonaws.com",
              "sub": "repo:rhprasad0@91573985/nova-toll-budget-agent@1306930324:environment:development",
              "environment": "development",
              "repository": "rhprasad0/nova-toll-budget-agent",
              "ref": "refs/heads/main",
              "sha": expected_sha,
          }

          def decode(segment: str) -> bytes:
              if not re.fullmatch(r"[A-Za-z0-9_-]+", segment) or len(segment) % 4 == 1:
                  raise ValueError("malformed OIDC token")
              try:
                  decoded = base64.urlsafe_b64decode(
                      segment + "=" * (-len(segment) % 4)
                  )
              except binascii.Error as error:
                  raise ValueError("malformed OIDC token") from error
              if base64.urlsafe_b64encode(decoded).rstrip(b"=").decode() != segment:
                  raise ValueError("malformed OIDC token")
              return decoded

          parts = token.split(".")
          if len(parts) != 3:
              raise ValueError("malformed OIDC token")
          try:
              header = json.loads(decode(parts[0]).decode("utf-8"))
              claims = json.loads(decode(parts[1]).decode("utf-8"))
              decode(parts[2])
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise ValueError("malformed OIDC token") from error
          if not isinstance(header, dict) or not isinstance(claims, dict) or not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise ValueError("invalid OIDC claims")
          if any(claims.get(name) != value for name, value in expected.items()):
              raise ValueError("invalid OIDC claims")
          PY
          jq -n --arg commit "$GITHUB_SHA" \
            '{account:"903859731897",commit_sha:$commit,environment:"development",proof:"protected-main-oidc",ref:"refs/heads/main",repository:"rhprasad0/nova-toll-budget-agent"}' \
            >"$RUNNER_TEMP/protected-main-oidc.json"
          chmod 600 -- "$RUNNER_TEMP/protected-main-oidc.json"
          jq -e '
            type == "object" and (keys_unsorted | sort) == ["account", "commit_sha", "environment", "proof", "ref", "repository"] and
            .account == "903859731897" and .commit_sha == env.GITHUB_SHA and
            .environment == "development" and .proof == "protected-main-oidc" and
            .ref == "refs/heads/main" and .repository == "rhprasad0/nova-toll-budget-agent"
          ' "$RUNNER_TEMP/protected-main-oidc.json" >/dev/null

      - name: Upload protected-main OIDC proof
        id: upload-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-main-oidc-proof
          path: ${{ runner.temp }}/protected-main-oidc.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

  deploy:
    name: Deploy v2 to development
    needs: [admission, build, oidc-proof]
    # Repository variable: environment variables are unavailable to this pre-job gate.
    if: vars.DEVELOPMENT_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: development
    outputs:
      verified: ${{ steps.verify-release.outputs.verified }}
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: v2-development-apply
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck admission before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          PREDECESSOR_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/development-changed-paths"
          if [[ "$PREDECESSOR_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$CANDIDATE_SHA" >"$changed_paths"
          else
            git diff --name-only "$PREDECESSOR_SHA" "$CANDIDATE_SHA" >"$changed_paths"
          fi
          python3 v2/scripts/check_development_admission.py \
            --repository "$REPOSITORY" \
            --sha "$CANDIDATE_SHA" \
            --before "$PREDECESSOR_SHA" \
            --event-file "$GITHUB_EVENT_PATH" \
            --paths-file "$changed_paths" \
            --run-id "$GITHUB_RUN_ID" \
            --recheck \
            --timeout-seconds 60 \
            --poll-seconds 5 \
            >"$RUNNER_TEMP/development-admission-recheck.result"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.8"

      - name: Download deployment checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v2-development-checksums-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v2-development-checksums

      - name: Download and verify immutable release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test "$RELEASE_ARTIFACT_ID" -gt 0
          [[ "$RELEASE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID"
          metadata="$RUNNER_TEMP/release-artifact.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$API_ROOT" >"$metadata"
          jq -e --arg id "$RELEASE_ARTIFACT_ID" --arg name "v2-development-release-$GITHUB_SHA" --arg commit "$GITHUB_SHA" '
            type == "object" and (.id | tostring) == $id and .expired == false and
            .name == $name and .workflow_run.head_sha == $commit
          ' "$metadata" >/dev/null

          headers="$RUNNER_TEMP/release-artifact.headers"
          archive="$RUNNER_TEMP/release-artifact.zip"
          set +e
          redirect_status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null \
            --write-out '%{http_code}' --max-redirs 0 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' "$API_ROOT/zip")"
          set -e
          test "$redirect_status" = 302
          download_url="$(awk 'tolower($1) == "location:" {sub(/^[[:space:]]+/, "", $2); print $2}' "$headers" | tr -d '\r' | tail -n 1)"
          test -n "$download_url"
          case "$download_url" in https://*) ;; *) echo "artifact redirect is not HTTPS" >&2; exit 1 ;; esac
          unset GH_TOKEN
          curl --fail --silent --show-error --location "$download_url" -o "$archive"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$RELEASE_ARTIFACT_DIGEST"

          overlay="$RUNNER_TEMP/release-overlay"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 v2/scripts/verify_release_bundle.py verify \
            --archive "$archive" --output "$overlay" --root "$GITHUB_WORKSPACE" \
            --expected-digest "$RELEASE_ARTIFACT_DIGEST" --commit "$GITHUB_SHA" \
            --verify-checkout
          jq -e --arg expected_commit "$GITHUB_SHA" '
            type == "object" and .commit_sha == $expected_commit and
            (.schema_versions | type == "object" and
             (.pricing | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$")) and
             (.oracle | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$")))
          ' "$overlay/release-manifest.json" >/dev/null
          {
            printf 'EXPECTED_PRICING_VERSION=%s\n' "$(jq -er '.schema_versions.pricing' "$overlay/release-manifest.json")"
            printf 'EXPECTED_ORACLE_VERSION=%s\n' "$(jq -er '.schema_versions.oracle' "$overlay/release-manifest.json")"
          } >>"$GITHUB_ENV"

          mkdir -p "$overlay/v2/infra/lambda-stub" "$overlay/infra"
          for reviewed_source in \
            "$GITHUB_WORKSPACE/v2/infra/"*.tf \
            "$GITHUB_WORKSPACE/v2/infra/.terraform.lock.hcl" \
            "$GITHUB_WORKSPACE/v2/infra/backend.development.hcl" \
            "$GITHUB_WORKSPACE/v2/infra/development.tfvars"; do
            cp -- "$reviewed_source" "$overlay/v2/infra/"
          done
          cp -- "$GITHUB_WORKSPACE/v2/infra/lambda-stub/handler.py" "$overlay/v2/infra/lambda-stub/"
          cp -- "$GITHUB_WORKSPACE/infra/account-contract.json" "$overlay/infra/"

          test -s "$overlay/v2/infra/build/loader.zip"
          test -s "$overlay/v2/infra/build/publisher.zip"
          test -s "$overlay/v2/infra/build/agentcore.zip"
          test -s "$overlay/v2/infra/build/chat-proxy.zip"

      - name: Verify immutable development release without credentials
        run: |
          set -euo pipefail
          umask 077
          EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
          PACKAGE_DIR="$RUNNER_TEMP/release-overlay/v2/infra/build"
          python3 infra/release_manifest.py \
            --manifest "$EVIDENCE_DIR/development-release-manifest.json" \
            --package-dir "$PACKAGE_DIR" \
            --checksums "$EVIDENCE_DIR/DEPLOYMENT_SHA256SUMS" \
            --candidate-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --bundle-root "$RUNNER_TEMP/release-overlay" \
            --evidence "$EVIDENCE_DIR/development-release-evidence.json" \
            >"$RUNNER_TEMP/development-release-verification.json"
          jq -e '.status == "accepted" and .reason_code == "ok"' \
            "$RUNNER_TEMP/development-release-verification.json" >/dev/null

      - name: Download protected-main OIDC proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oidc-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Validate protected-main OIDC proof
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/protected-main-oidc.json"
          test -f "$PROOF" && test ! -L "$PROOF"
          jq -e --arg commit "$GITHUB_SHA" '
            type == "object" and (keys_unsorted | sort) == ["account", "commit_sha", "environment", "proof", "ref", "repository"] and
            .account == "903859731897" and .commit_sha == $commit and
            (.commit_sha | test("^[0-9a-f]{40}$")) and .environment == "development" and
            .proof == "protected-main-oidc" and .ref == "refs/heads/main" and
            .repository == "rhprasad0/nova-toll-budget-agent"
          ' "$PROOF" >/dev/null

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-delivery
          aws-region: us-east-1

      - name: Confirm development account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "903859731897"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::903859731897:assumed-role/nova-toll-v2-development-delivery/*) ;;
            *) exit 1 ;;
          esac

      - name: Create and gate the saved development plan before migrations
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/protected-main-oidc.json"
          RELEASE_ROOT="$RUNNER_TEMP/release-overlay"
          EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
          PACKAGE_DIR="$RELEASE_ROOT/v2/infra/build"
          PROOF="$RUNNER_TEMP/protected-main-oidc.json"
          FOUNDATION_OUTPUT="$RUNNER_TEMP/development-foundation-output.json"
          FOUNDATION_VARS="$RUNNER_TEMP/foundation.tfvars.json"
          FOUNDATION_OUTPUT_FILE="$FOUNDATION_OUTPUT"
          TF_LOG_DIR="$RUNNER_TEMP/development-terraform-logs"
          mkdir -m 700 -- "$TF_LOG_DIR"
          FOUNDATION_INIT_LOG="$TF_LOG_DIR/foundation-init.log"
          FOUNDATION_OUTPUT_LOG="$TF_LOG_DIR/foundation-output.log"
          APPLICATION_INIT_LOG="$TF_LOG_DIR/release-init.log"
          PLAN="$RUNNER_TEMP/development.tfplan"
          PLAN_LOG="$TF_LOG_DIR/plan.log"
          PLAN_JSON="$RUNNER_TEMP/development.tfplan.json"
          SHOW_LOG="$TF_LOG_DIR/show.log"
          FOUNDATION_VALIDATE_LOG="$TF_LOG_DIR/foundation-validate.log"
          IDENTITY="$RUNNER_TEMP/development-plan-identity.json"
          MANIFEST="$EVIDENCE_DIR/development-release-manifest.json"
          VALIDATION="$RUNNER_TEMP/development-plan-validation.json"

          test -s "$PROOF"
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config=backend.development.hcl >"$FOUNDATION_INIT_LOG" 2>&1
          terraform -chdir=infra output -json foundation >"$FOUNDATION_OUTPUT" 2>"$FOUNDATION_OUTPUT_LOG"
          jq -e '
            def exact_keys($keys): type == "object" and ((keys_unsorted | sort) == ($keys | sort));
            . as $foundation |
            exact_keys(["vpc_id", "vpc_cidr_block", "private_subnet_ids", "rds_security_group_id", "agentcore_endpoint_security_group_id", "eventbridge_endpoint_security_group_id", "agentcore_vpc_endpoint_id", "agentcore_vpc_endpoint_dns_name", "tollchat_api_vpc_endpoint_id", "raw_bucket_name", "raw_kms_key_arn", "agentcore_artifacts_bucket_name", "db_instance", "alerts_topic_arn"])
            and all(["vpc_id", "vpc_cidr_block", "rds_security_group_id", "agentcore_endpoint_security_group_id", "eventbridge_endpoint_security_group_id", "agentcore_vpc_endpoint_id", "agentcore_vpc_endpoint_dns_name", "tollchat_api_vpc_endpoint_id", "raw_bucket_name", "raw_kms_key_arn", "agentcore_artifacts_bucket_name", "alerts_topic_arn"][]; $foundation[.] | type == "string" and length > 0)
            and ($foundation.private_subnet_ids | exact_keys(["a", "c"]) and all(.[]; type == "string" and length > 0))
            and ($foundation.db_instance | exact_keys(["identifier", "resource_id", "address", "port"]) and all(["identifier", "resource_id", "address"][]; $foundation.db_instance[.] | type == "string" and length > 0) and (.port | type == "number"))
          ' "$FOUNDATION_OUTPUT" > /dev/null 2>"$FOUNDATION_VALIDATE_LOG"
          jq -n --slurpfile foundation "$FOUNDATION_OUTPUT" '{foundation: $foundation[0]}' >"$FOUNDATION_VARS"
          chmod 600 -- "$FOUNDATION_VARS"
          printf '%s\n' '{"provider":"hashicorp/aws","provider_version":"6.60.0","terraform_version":"1.15.8","lockfile":"v2/infra/.terraform.lock.hcl","lock_identity":"V2-AWS60"}' >"$IDENTITY"
          chmod 600 -- "$IDENTITY"

          terraform -chdir="$RELEASE_ROOT/v2/infra" init -input=false -lockfile=readonly \
            -backend-config=backend.development.hcl >"$APPLICATION_INIT_LOG" 2>&1
          terraform -chdir="$RELEASE_ROOT/v2/infra" plan -input=false -out="$PLAN" \
            -var-file=development.tfvars \
            -var-file="$FOUNDATION_VARS" \
            -var loader_package_path="$PACKAGE_DIR/loader.zip" \
            -var publisher_package_path="$PACKAGE_DIR/publisher.zip" \
            -var agentcore_package_path="$PACKAGE_DIR/agentcore.zip" \
            -var chat_proxy_package_path="$PACKAGE_DIR/chat-proxy.zip" \
            >"$PLAN_LOG" 2>&1

          terraform -chdir="$RELEASE_ROOT/v2/infra" show -json "$PLAN" >"$PLAN_JSON" 2>"$SHOW_LOG"
          MANIFEST_VALID=true
          IDENTITY_VALID=true
          test -f "$MANIFEST" && test ! -L "$MANIFEST" && test -r "$MANIFEST" || MANIFEST_VALID=false
          test -f "$IDENTITY" && test ! -L "$IDENTITY" && test -r "$IDENTITY" || IDENTITY_VALID=false
          set +e
          python3 infra/delivery_plan_validator.py "$PLAN_JSON" "$MANIFEST" --identity "$IDENTITY" >"$VALIDATION"
          VALIDATOR_STATUS=$?
          set -e
          jq -e 'type == "object" and (.status == "accepted" or .status == "rejected") and (.reason_code | type == "string")' "$VALIDATION" >/dev/null
          test "$MANIFEST_VALID" = true
          test "$IDENTITY_VALID" = true
          test "$VALIDATOR_STATUS" -eq 0
          chmod 600 -- "$PLAN" "$PLAN_JSON" "$FOUNDATION_VARS"

      - name: Fetch pinned RDS CA bundle for automatic migrations
        run: |
          set -euo pipefail
          set +x
          mkdir -p v2/infra/build/ca
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o v2/infra/build/ca/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  v2/infra/build/ca/rds-ca-bundle.pem" | sha256sum --check --status
          chmod 600 v2/infra/build/ca/rds-ca-bundle.pem

      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_DEVELOPMENT_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_DEVELOPMENT_OAUTH_SECRET }}
          tags: tag:ci-development

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-migrations-dev
          aws-region: us-east-1
          unset-current-credentials: true

      - name: Run reviewed backward-compatible development migrations
        run: bash v2/scripts/run_development_migrations_workflow.sh

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-delivery
          aws-region: us-east-1
          unset-current-credentials: true

      - name: Confirm delivery role before applying saved plan
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "903859731897"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::903859731897:assumed-role/nova-toll-v2-development-delivery/*) ;;
            *) exit 1 ;;
          esac

      - name: Apply the same saved development plan
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/release-overlay"
          PLAN="$RUNNER_TEMP/development.tfplan"
          TF_LOG_DIR="$RUNNER_TEMP/development-terraform-logs"
          APPLY_LOG="$TF_LOG_DIR/apply.log"
          test -s "$PLAN"
          if ! terraform -chdir="$RELEASE_ROOT/v2/infra" apply -input=false "$PLAN" >"$APPLY_LOG" 2>&1; then
            echo "terraform stage failed: apply" >&2
            exit 1
          fi
          rm -f -- "$RUNNER_TEMP/foundation.tfvars.json" "$RUNNER_TEMP/foundation-output.json" "$PLAN" "$RUNNER_TEMP/development.tfplan.json"
          rm -rf -- "$TF_LOG_DIR"

      - name: Verify readiness and public release path
        id: verify-release
        run: |
          set -euo pipefail
          set +x
          umask 077
          state="$RUNNER_TEMP/development-readiness-state.json"
          error_log="$RUNNER_TEMP/development-readiness-state.log"
          trap 'rm -f -- "$state" "$error_log"' EXIT
          if ! terraform -chdir="$RUNNER_TEMP/release-overlay/v2/infra" show -json >"$state" 2>"$error_log"; then
            echo "development readiness state unavailable" >&2
            exit 1
          fi
          python3 v2/scripts/check_development_release.py \
            "$state" "$RUNNER_TEMP/release-overlay/release-manifest.json"
          echo 'verified=success' >>"$GITHUB_OUTPUT"

      - name: Cleanup private delivery files
        if: always()
        run: |
          set +e
          rm -rf -- "$RUNNER_TEMP/v2-development-packages" \
            "$RUNNER_TEMP/v2-development-checksums" "$RUNNER_TEMP/release-overlay" \
            "$RUNNER_TEMP/development-terraform-logs" \
            "$RUNNER_TEMP/foundation.tfvars.json" "$RUNNER_TEMP/development-foundation-output.json" \
            "$RUNNER_TEMP/development-foundation-init.log" "$RUNNER_TEMP/development-foundation-output.log" \
            "$RUNNER_TEMP/development-application-init.log" "$RUNNER_TEMP/development.tfplan" \
            "$RUNNER_TEMP/development.tfplan.log" "$RUNNER_TEMP/development.tfplan.json" \
            "$RUNNER_TEMP/development.tfshow.log" "$RUNNER_TEMP/development-apply.log" \
            "$RUNNER_TEMP/development-foundation-validate.log" "$RUNNER_TEMP/development-plan-identity.json" \
            "$RUNNER_TEMP/development-release-manifest.json" "$RUNNER_TEMP/development-plan-validation.json" \
            "$RUNNER_TEMP/development-release-verification.json" "$RUNNER_TEMP/v2-development-migrations-evidence.json" \
            "$RUNNER_TEMP/development-readiness-state.json" "$RUNNER_TEMP/development-readiness-state.log" \
            "$GITHUB_WORKSPACE/infra/.terraform" "$GITHUB_WORKSPACE/v2/infra/.terraform" \
            "$GITHUB_WORKSPACE/v2/infra/build/ca"
          rm -f -- "$RUNNER_TEMP/protected-main-oidc.json"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN

  release-result:
    name: Record end-to-end development result
    needs: [admission, release-record, build, oidc-proof, deploy]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Publish sanitized release outcome
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 v2/scripts/development_deployment_status.py finish
