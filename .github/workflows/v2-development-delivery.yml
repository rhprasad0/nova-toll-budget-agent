name: v2-development-delivery

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  admission:
    name: Admit exact main delivery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check exact CI evidence and predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          PREDECESSOR_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          PRIVATE_STAGE_REPORTED=0
          PRIVATE_STAGE_SUMMARY_FAILED=0
          admission_fallback() {
            local status=$?
            if test "$status" -ne 0 && test "$PRIVATE_STAGE_REPORTED" -eq 0; then
              _run_private_stage_emit "stage=admission status=fail elapsed=0 exit=$status reason=upstream_failed"
            fi
            trap - EXIT
            exit "$status"
          }
          trap admission_fallback EXIT
          _run_private_stage_emit 'stage=admission status=start elapsed=0 exit=0 reason=unclassified'
          changed_paths="$RUNNER_TEMP/development-changed-paths"
          if [[ "$PREDECESSOR_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$CANDIDATE_SHA" >"$changed_paths"
          else
            git diff --name-only "$PREDECESSOR_SHA" "$CANDIDATE_SHA" >"$changed_paths"
          fi
          if python3 v2/scripts/check_development_admission.py \
              --repository "$REPOSITORY" \
              --sha "$CANDIDATE_SHA" \
              --before "$PREDECESSOR_SHA" \
              --event-file "$GITHUB_EVENT_PATH" \
              --paths-file "$changed_paths" \
              --run-id "$GITHUB_RUN_ID" \
              --timeout-seconds 900 \
              --poll-seconds 10 \
              >"$RUNNER_TEMP/development-admission.result"; then
            :
          else
            status=$?
            PRIVATE_STAGE_REPORTED=1
            exit "$status"
          fi
          _run_private_stage_emit 'stage=admission status=pass elapsed=0 exit=0 reason=unclassified'
          if (( PRIVATE_STAGE_SUMMARY_FAILED )); then
            PRIVATE_STAGE_REPORTED=1
            _run_private_stage_emit 'stage=admission status=fail elapsed=0 exit=125 reason=diagnostic_unavailable'
            exit 125
          fi
          if ! cat "$RUNNER_TEMP/development-admission.result" >>"$GITHUB_STEP_SUMMARY"; then
            PRIVATE_STAGE_REPORTED=1
            _run_private_stage_emit 'stage=admission status=fail elapsed=0 exit=125 reason=diagnostic_unavailable'
            exit 125
          fi
          trap - EXIT

  release-record:
    name: Record exact development release
    needs: admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.record.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create end-to-end release record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 v2/scripts/development_deployment_status.py create

  build:
    name: Build v2 deployment packages
    needs: [admission, release-record]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.release-identity.outputs.artifact_id }}
      artifact_digest: ${{ steps.release-identity.outputs.artifact_digest }}
      pricing_schema: ${{ steps.release-identity.outputs.pricing_schema }}
      oracle_schema: ${{ steps.release-identity.outputs.oracle_schema }}
    steps:
      - name: Reject retained exact release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          metadata="$RUNNER_TEMP/release-artifacts.json"
          metadata_error="$RUNNER_TEMP/release-artifacts.error"
          retained_reason=publisher_failed
          bootstrap_event() {
            local event="$1"
            printf '%s\n' "$event" >&2
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              printf '%s\n' "$event" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null ||
                printf '%s\n' 'stage=retained-artifact status=fail elapsed=0 exit=125 reason=diagnostic_unavailable' >&2
            fi
          }
          retained_artifact_fallback() {
            local status=$?
            if test "$status" -ne 0; then
              bootstrap_event "stage=retained-artifact status=fail elapsed=0 exit=$status reason=$retained_reason"
            fi
            rm -f -- "$metadata" "$metadata_error"
            trap - EXIT
            exit "$status"
          }
          trap retained_artifact_fallback EXIT
          bootstrap_event 'stage=retained-artifact status=start elapsed=0 exit=0 reason=unclassified'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=v2-development-release-$GITHUB_SHA&per_page=100" \
            >"$metadata" 2>"$metadata_error"
          set +e
          jq -e 'type == "object" and (.artifacts | type == "array")' \
            "$metadata" >/dev/null 2>>"$metadata_error"
          metadata_status=$?
          set -e
          case "$metadata_status" in
            0) ;;
            1) retained_reason=malformed_evidence; exit 1 ;;
            *) retained_reason=malformed_evidence; exit "$metadata_status" ;;
          esac
          set +e
          jq -e --arg name "v2-development-release-$GITHUB_SHA" \
            '.artifacts | any(.[]; .name == $name and .expired == false)' \
            "$metadata" >/dev/null 2>>"$metadata_error"
          retained_status=$?
          set -e
          case "$retained_status" in
            0) retained_reason=retained_artifact; exit 1 ;;
            1) ;;
            *) retained_reason=malformed_evidence; exit "$retained_status" ;;
          esac
          bootstrap_event 'stage=retained-artifact status=pass elapsed=0 exit=0 reason=unclassified'
          rm -f -- "$metadata" "$metadata_error"
          trap - EXIT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          python-version: "3.13"

      - name: Build reviewed deployment packages
        working-directory: v2
        run: |
          set -euo pipefail
          source scripts/run_private_stage.sh
          run_private_stage "artifact-build" "$RUNNER_TEMP/development-artifact-build.log" "$RUNNER_TEMP/development-artifact-build.log" \
            ./scripts/build_release_bundle.sh

      - name: Prepare immutable release evidence inputs
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          prepare_evidence() {
            set -euo pipefail
            umask 077
            test ! -e "$GITHUB_WORKSPACE/trusted-build"
            test -f v2/infra/build/DEPLOYMENT_SHA256SUMS && test ! -L v2/infra/build/DEPLOYMENT_SHA256SUMS
            EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
            mkdir "$EVIDENCE_DIR"
            git show "${GITHUB_SHA}:infra/development-release-manifest.json" \
              >"$EVIDENCE_DIR/development-release-manifest.json"
            cp -P -- v2/infra/build/DEPLOYMENT_SHA256SUMS "$EVIDENCE_DIR/"
          }
          run_private_stage "artifact-metadata" "$RUNNER_TEMP/development-artifact-metadata.log" "$RUNNER_TEMP/development-artifact-metadata.log" \
            prepare_evidence

      - name: Checkout trusted manifest verifier after package build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-build
          persist-credentials: false

      - name: Verify reviewed manifest and write runtime evidence
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          verify_release() {
            set -euo pipefail
            umask 077
            EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
            python3 trusted-build/infra/release_manifest.py \
              --manifest "$EVIDENCE_DIR/development-release-manifest.json" \
              --package-dir v2/infra/build \
              --checksums "$EVIDENCE_DIR/DEPLOYMENT_SHA256SUMS" \
              --candidate-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --repo-root "$GITHUB_WORKSPACE" \
              --bundle-root v2/infra/build/release \
              --write-evidence "$EVIDENCE_DIR/development-release-evidence.json" \
              >"$RUNNER_TEMP/development-release-verification.json"
            jq -e '.status == "accepted" and .reason_code == "ok"' \
              "$RUNNER_TEMP/development-release-verification.json" >/dev/null
          }
          run_private_stage "release-verification" "$RUNNER_TEMP/development-release-verification.log" "$RUNNER_TEMP/development-release-verification.log" \
            verify_release

      - name: Upload immutable deployment packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-packages-${{ github.run_id }}-${{ github.sha }}
          path: |
            v2/infra/build/loader.zip
            v2/infra/build/publisher.zip
            v2/infra/build/agentcore.zip
            v2/infra/build/chat-proxy.zip
          if-no-files-found: error

      - name: Upload immutable release bundle
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-release-${{ github.sha }}
          path: v2/infra/build/release
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Upload deployment checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-checksums-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v2-development-checksums
          if-no-files-found: error

      - name: Record release identity
        id: release-identity
        env:
          RELEASE_ARTIFACT_ID: ${{ steps.upload-release.outputs.artifact-id }}
          RAW_RELEASE_ARTIFACT_DIGEST: ${{ steps.upload-release.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          record_release_identity() {
            set -euo pipefail
            test "$RELEASE_ARTIFACT_ID" -gt 0
            if [[ "$RAW_RELEASE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              RELEASE_ARTIFACT_DIGEST="$RAW_RELEASE_ARTIFACT_DIGEST"
            elif [[ "$RAW_RELEASE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
              RELEASE_ARTIFACT_DIGEST="sha256:$RAW_RELEASE_ARTIFACT_DIGEST"
            else
              exit 1
            fi
            printf 'artifact_id=%s\nartifact_digest=%s\n' \
              "$RELEASE_ARTIFACT_ID" "$RELEASE_ARTIFACT_DIGEST" >>"$GITHUB_OUTPUT"
            SCHEMA_PRICING="$(jq -er '.schema_versions.pricing' v2/infra/build/release/release-manifest.json)"
            SCHEMA_ORACLE="$(jq -er '.schema_versions.oracle' v2/infra/build/release/release-manifest.json)"
            printf 'pricing_schema=%s\noracle_schema=%s\n' "$SCHEMA_PRICING" "$SCHEMA_ORACLE" >>"$GITHUB_OUTPUT"
            printf 'release_artifact_id=%s\nrelease_artifact_digest=%s\ncommit_sha=%s\npricing_schema=%s\noracle_schema=%s\n' \
              "$RELEASE_ARTIFACT_ID" "$RELEASE_ARTIFACT_DIGEST" "$GITHUB_SHA" \
              "$SCHEMA_PRICING" "$SCHEMA_ORACLE" >>"$GITHUB_STEP_SUMMARY"
          }
          run_private_stage "artifact-metadata" "$RUNNER_TEMP/development-release-identity.log" "$RUNNER_TEMP/development-release-identity.log" \
            record_release_identity

      - name: Cleanup release evidence
        if: always()
        run: |
          set +e
          source v2/scripts/run_private_stage.sh
          run_private_stage "cleanup" "$RUNNER_TEMP/development-build-cleanup.log" "$RUNNER_TEMP/development-build-cleanup.log" \
            rm -rf -- "$RUNNER_TEMP/v2-development-checksums" \
              "$RUNNER_TEMP/development-release-verification.json" "$GITHUB_WORKSPACE/trusted-build"

  oidc-proof:
    name: Prove protected main OIDC claims
    needs: admission
    if: github.ref == 'refs/heads/main' && needs.admission.result == 'success'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
    steps:
      - name: Validate runner OIDC claims
        run: |
          set +x
          set -euo pipefail
          oidc_error="$RUNNER_TEMP/development-oidc-proof.error"
          bootstrap_event() {
            local event="$1"
            printf '%s\n' "$event" >&2
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              printf '%s\n' "$event" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null ||
                printf '%s\n' 'stage=oidc-claims status=fail elapsed=0 exit=125 reason=diagnostic_unavailable' >&2
            fi
          }
          oidc_fallback() {
            local status=$?
            if test "$status" -ne 0; then
              bootstrap_event "stage=oidc-claims status=fail elapsed=0 exit=$status reason=malformed_evidence"
            fi
            trap - EXIT
            exit "$status"
          }
          trap oidc_fallback EXIT
          bootstrap_event 'stage=oidc-claims status=start elapsed=0 exit=0 reason=unclassified'
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            *\?*) oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" ;;
            *) oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=sts.amazonaws.com" ;;
          esac
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url" 2>"$oidc_error")"
          oidc_token="$(jq -er '.value | strings' <<<"$oidc_response" 2>>"$oidc_error")"
          {
          OIDC_TOKEN="$oidc_token" python3 - "$GITHUB_SHA" <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          import sys

          token = os.environ.pop("OIDC_TOKEN", "")
          expected_sha = sys.argv[1]
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "sts.amazonaws.com",
              "sub": "repo:rhprasad0@91573985/nova-toll-budget-agent@1306930324:environment:development",
              "environment": "development",
              "repository": "rhprasad0/nova-toll-budget-agent",
              "ref": "refs/heads/main",
              "sha": expected_sha,
          }

          def decode(segment: str) -> bytes:
              if not re.fullmatch(r"[A-Za-z0-9_-]+", segment) or len(segment) % 4 == 1:
                  raise ValueError("malformed OIDC token")
              try:
                  decoded = base64.urlsafe_b64decode(
                      segment + "=" * (-len(segment) % 4)
                  )
              except binascii.Error as error:
                  raise ValueError("malformed OIDC token") from error
              if base64.urlsafe_b64encode(decoded).rstrip(b"=").decode() != segment:
                  raise ValueError("malformed OIDC token")
              return decoded

          parts = token.split(".")
          if len(parts) != 3:
              raise ValueError("malformed OIDC token")
          try:
              header = json.loads(decode(parts[0]).decode("utf-8"))
              claims = json.loads(decode(parts[1]).decode("utf-8"))
              decode(parts[2])
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise ValueError("malformed OIDC token") from error
          if not isinstance(header, dict) or not isinstance(claims, dict) or not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise ValueError("invalid OIDC claims")
          if any(claims.get(name) != value for name, value in expected.items()):
              raise ValueError("invalid OIDC claims")
          PY
          } 2>>"$oidc_error"
          jq -n --arg commit "$GITHUB_SHA" \
            '{account:"903859731897",commit_sha:$commit,environment:"development",proof:"protected-main-oidc",ref:"refs/heads/main",repository:"rhprasad0/nova-toll-budget-agent"}' \
            >"$RUNNER_TEMP/protected-main-oidc.json"
          chmod 600 -- "$RUNNER_TEMP/protected-main-oidc.json"
          jq -e '
            type == "object" and (keys_unsorted | sort) == ["account", "commit_sha", "environment", "proof", "ref", "repository"] and
            .account == "903859731897" and .commit_sha == env.GITHUB_SHA and
            .environment == "development" and .proof == "protected-main-oidc" and
            .ref == "refs/heads/main" and .repository == "rhprasad0/nova-toll-budget-agent"
          ' "$RUNNER_TEMP/protected-main-oidc.json" >/dev/null 2>>"$oidc_error"
          bootstrap_event 'stage=oidc-claims status=pass elapsed=0 exit=0 reason=unclassified'
          trap - EXIT

      - name: Upload protected-main OIDC proof
        id: upload-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-main-oidc-proof
          path: ${{ runner.temp }}/protected-main-oidc.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

      - name: Cleanup OIDC proof diagnostics
        if: always()
        run: |
          set +e
          rm -f -- "$RUNNER_TEMP/protected-main-oidc.json" "$RUNNER_TEMP/development-oidc-proof.error"
          exit 0

  deploy:
    name: Deploy v2 to development
    needs: [admission, build, oidc-proof]
    # Repository variable: environment variables are unavailable to this pre-job gate.
    if: vars.DEVELOPMENT_DELIVERY_ENABLED == 'true' && github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    environment: development
    outputs:
      verified: ${{ steps.verify-release.outputs.verified }}
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: v2-development-apply
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck admission before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          PREDECESSOR_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          PRIVATE_STAGE_REPORTED=0
          PRIVATE_STAGE_SUMMARY_FAILED=0
          admission_recheck_fallback() {
            local status=$?
            if test "$status" -ne 0 && test "$PRIVATE_STAGE_REPORTED" -eq 0; then
              _run_private_stage_emit "stage=admission-recheck status=fail elapsed=0 exit=$status reason=upstream_failed"
            fi
            trap - EXIT
            exit "$status"
          }
          trap admission_recheck_fallback EXIT
          _run_private_stage_emit 'stage=admission-recheck status=start elapsed=0 exit=0 reason=unclassified'
          changed_paths="$RUNNER_TEMP/development-changed-paths"
          if [[ "$PREDECESSOR_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$CANDIDATE_SHA" >"$changed_paths"
          else
            git diff --name-only "$PREDECESSOR_SHA" "$CANDIDATE_SHA" >"$changed_paths"
          fi
          if python3 v2/scripts/check_development_admission.py \
              --repository "$REPOSITORY" \
              --sha "$CANDIDATE_SHA" \
              --before "$PREDECESSOR_SHA" \
              --event-file "$GITHUB_EVENT_PATH" \
              --paths-file "$changed_paths" \
              --run-id "$GITHUB_RUN_ID" \
              --recheck \
              --timeout-seconds 60 \
              --poll-seconds 5 \
              >"$RUNNER_TEMP/development-admission-recheck.result"; then
            _run_private_stage_emit 'stage=admission-recheck status=pass elapsed=0 exit=0 reason=unclassified'
            trap - EXIT
          else
            status=$?
            exit "$status"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.8"

      - name: Download deployment checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v2-development-checksums-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/v2-development-checksums

      - name: Download and verify immutable release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          download_release() {
          set -euo pipefail
          test "$RELEASE_ARTIFACT_ID" -gt 0
          [[ "$RELEASE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID"
          metadata="$RUNNER_TEMP/release-artifact.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$API_ROOT" >"$metadata"
          jq -e --arg id "$RELEASE_ARTIFACT_ID" --arg name "v2-development-release-$GITHUB_SHA" --arg commit "$GITHUB_SHA" '
            type == "object" and (.id | tostring) == $id and .expired == false and
            .name == $name and .workflow_run.head_sha == $commit
          ' "$metadata" >/dev/null

          headers="$RUNNER_TEMP/release-artifact.headers"
          archive="$RUNNER_TEMP/release-artifact.zip"
          set +e
          redirect_status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null \
            --write-out '%{http_code}' --max-redirs 0 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' "$API_ROOT/zip")"
          set -e
          test "$redirect_status" = 302
          download_url="$(awk 'tolower($1) == "location:" {sub(/^[[:space:]]+/, "", $2); print $2}' "$headers" | tr -d '\r' | tail -n 1)"
          test -n "$download_url"
          case "$download_url" in https://*) ;; *) exit 1 ;; esac
          unset GH_TOKEN
          curl --fail --silent --show-error --location "$download_url" -o "$archive"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$RELEASE_ARTIFACT_DIGEST"

          overlay="$RUNNER_TEMP/release-overlay"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 v2/scripts/verify_release_bundle.py verify \
            --archive "$archive" --output "$overlay" --root "$GITHUB_WORKSPACE" \
            --expected-digest "$RELEASE_ARTIFACT_DIGEST" --commit "$GITHUB_SHA" \
            --verify-checkout
          jq -e --arg expected_commit "$GITHUB_SHA" '
            type == "object" and .commit_sha == $expected_commit and
            (.schema_versions | type == "object" and
             (.pricing | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$")) and
             (.oracle | type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$")))
          ' "$overlay/release-manifest.json" >/dev/null
          {
            printf 'EXPECTED_PRICING_VERSION=%s\n' "$(jq -er '.schema_versions.pricing' "$overlay/release-manifest.json")"
            printf 'EXPECTED_ORACLE_VERSION=%s\n' "$(jq -er '.schema_versions.oracle' "$overlay/release-manifest.json")"
          } >>"$GITHUB_ENV"

          mkdir -p "$overlay/v2/infra/lambda-stub" "$overlay/infra"
          for reviewed_source in \
            "$GITHUB_WORKSPACE/v2/infra/"*.tf \
            "$GITHUB_WORKSPACE/v2/infra/.terraform.lock.hcl" \
            "$GITHUB_WORKSPACE/v2/infra/backend.development.hcl" \
            "$GITHUB_WORKSPACE/v2/infra/development.tfvars"; do
            cp -- "$reviewed_source" "$overlay/v2/infra/"
          done
          cp -- "$GITHUB_WORKSPACE/v2/infra/lambda-stub/handler.py" "$overlay/v2/infra/lambda-stub/"
          cp -- "$GITHUB_WORKSPACE/infra/account-contract.json" "$overlay/infra/"

          test -s "$overlay/v2/infra/build/loader.zip"
          test -s "$overlay/v2/infra/build/publisher.zip"
          test -s "$overlay/v2/infra/build/agentcore.zip"
          test -s "$overlay/v2/infra/build/chat-proxy.zip"
          }
          run_private_stage "artifact-download" "$RUNNER_TEMP/development-artifact-download.log" "$RUNNER_TEMP/development-artifact-download.log" \
            download_release

      - name: Verify immutable development release without credentials
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          verify_staged_release() {
          set -euo pipefail
          umask 077
          EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
          RELEASE_ROOT="$RUNNER_TEMP/release-overlay"
          PACKAGE_DIR="$RELEASE_ROOT/v2/infra/build"
          STAGED_PACKAGE_DIR="$RUNNER_TEMP/v2-development-packages"
          python3 infra/release_manifest.py \
            --manifest "$EVIDENCE_DIR/development-release-manifest.json" \
            --package-dir "$PACKAGE_DIR" \
            --checksums "$EVIDENCE_DIR/DEPLOYMENT_SHA256SUMS" \
            --candidate-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --bundle-root "$RUNNER_TEMP/release-overlay" \
            --evidence "$EVIDENCE_DIR/development-release-evidence.json" \
            >"$RUNNER_TEMP/development-release-verification.json"
          jq -e '.status == "accepted" and .reason_code == "ok"' \
            "$RUNNER_TEMP/development-release-verification.json" >/dev/null

          rm -rf -- "$STAGED_PACKAGE_DIR"
          mkdir -m 700 -- "$STAGED_PACKAGE_DIR"
          for package in loader.zip publisher.zip agentcore.zip chat-proxy.zip; do
            source="$PACKAGE_DIR/$package"
            test -f "$source" && test ! -L "$source" && test -s "$source"
            cp -P -- "$source" "$STAGED_PACKAGE_DIR/$package"
          done
          test "$(find "$STAGED_PACKAGE_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')" = \
            "agentcore.zip chat-proxy.zip loader.zip publisher.zip "
          for package in loader.zip publisher.zip agentcore.zip chat-proxy.zip; do
            test -f "$STAGED_PACKAGE_DIR/$package" && test ! -L "$STAGED_PACKAGE_DIR/$package" \
              && test -s "$STAGED_PACKAGE_DIR/$package"
          done
          (
            cd "$STAGED_PACKAGE_DIR"
            sha256sum --check "$EVIDENCE_DIR/DEPLOYMENT_SHA256SUMS" >/dev/null
          )
          python3 infra/release_manifest.py \
            --manifest "$EVIDENCE_DIR/development-release-manifest.json" \
            --package-dir "$STAGED_PACKAGE_DIR" \
            --checksums "$EVIDENCE_DIR/DEPLOYMENT_SHA256SUMS" \
            --candidate-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --bundle-root "$RELEASE_ROOT" \
            --evidence "$EVIDENCE_DIR/development-release-evidence.json" \
            >"$RUNNER_TEMP/development-release-staging-verification.json"
          jq -e '.status == "accepted" and .reason_code == "ok"' \
            "$RUNNER_TEMP/development-release-staging-verification.json" >/dev/null
          }
          run_private_stage "release-verification" "$RUNNER_TEMP/development-staging-verification.log" "$RUNNER_TEMP/development-staging-verification.log" \
            verify_staged_release

      - name: Download protected-main OIDC proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oidc-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Validate protected-main OIDC proof
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          validate_oidc_proof() {
          set -euo pipefail
          PROOF="$RUNNER_TEMP/protected-main-oidc.json"
          test -f "$PROOF" && test ! -L "$PROOF"
          jq -e --arg commit "$GITHUB_SHA" '
            type == "object" and (keys_unsorted | sort) == ["account", "commit_sha", "environment", "proof", "ref", "repository"] and
            .account == "903859731897" and .commit_sha == $commit and
            (.commit_sha | test("^[0-9a-f]{40}$")) and .environment == "development" and
            .proof == "protected-main-oidc" and .ref == "refs/heads/main" and
            .repository == "rhprasad0/nova-toll-budget-agent"
          ' "$PROOF" >/dev/null
          }
          run_private_stage "oidc-claims" "$RUNNER_TEMP/development-oidc-validation.log" "$RUNNER_TEMP/development-oidc-validation.log" \
            validate_oidc_proof

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-delivery
          aws-region: us-east-1

      - name: Confirm development account
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          confirm_account() {
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "903859731897"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::903859731897:assumed-role/nova-toll-v2-development-delivery/*) ;;
            *) exit 1 ;;
          esac
          }
          run_private_stage "account-identity" "$RUNNER_TEMP/development-account-identity.log" "$RUNNER_TEMP/development-account-identity.log" \
            confirm_account

      - name: Create and gate the saved development plan before migrations
        run: |
          set -euo pipefail
          umask 077
          source v2/scripts/run_private_stage.sh
          PRIVATE_STAGE_REPORTED=0
          PRIVATE_STAGE_FALLBACK_STAGE=plan
          private_stage_fallback() {
            local status=$?
            if test "$status" -ne 0 && test "$PRIVATE_STAGE_REPORTED" -eq 0; then
              _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
            fi
            trap - EXIT
            exit "$status"
          }
          trap private_stage_fallback EXIT
          test -s "$RUNNER_TEMP/protected-main-oidc.json"
          RELEASE_ROOT="$RUNNER_TEMP/release-overlay"
          EVIDENCE_DIR="$RUNNER_TEMP/v2-development-checksums"
          PACKAGE_DIR="$RUNNER_TEMP/v2-development-packages"
          PROOF="$RUNNER_TEMP/protected-main-oidc.json"
          FOUNDATION_OUTPUT="$RUNNER_TEMP/development-foundation-output.json"
          FOUNDATION_VARS="$RUNNER_TEMP/foundation.tfvars.json"
          FOUNDATION_OUTPUT_FILE="$FOUNDATION_OUTPUT"
          TF_LOG_DIR="$RUNNER_TEMP/development-terraform-logs"
          mkdir -m 700 -- "$TF_LOG_DIR"
          FOUNDATION_INIT_LOG="$TF_LOG_DIR/foundation-init.log"
          FOUNDATION_OUTPUT_LOG="$TF_LOG_DIR/foundation-output.log"
          APPLICATION_INIT_LOG="$TF_LOG_DIR/release-init.log"
          PLAN="$RUNNER_TEMP/development.tfplan"
          PLAN_LOG="$TF_LOG_DIR/plan.log"
          PLAN_JSON="$RUNNER_TEMP/development.tfplan.json"
          SHOW_LOG="$TF_LOG_DIR/show.log"
          FOUNDATION_VALIDATE_LOG="$TF_LOG_DIR/foundation-validate.log"
          FOUNDATION_VARS_LOG="$TF_LOG_DIR/foundation-vars.log"
          VALIDATOR_LOG="$TF_LOG_DIR/validator.log"
          VALIDATOR_PARSE_LOG="$TF_LOG_DIR/validator-parse.log"
          IDENTITY="$RUNNER_TEMP/development-plan-identity.json"
          MANIFEST="$EVIDENCE_DIR/development-release-manifest.json"
          VALIDATION="$RUNNER_TEMP/development-plan-validation.json"
          VALIDATION_SUMMARY="$RUNNER_TEMP/development-plan-validation-summary.json"

          test -s "$PROOF"
          run_private_stage "foundation-init" "$FOUNDATION_INIT_LOG" "$FOUNDATION_INIT_LOG" \
            terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config=backend.development.hcl
          run_private_stage "foundation-output" "$FOUNDATION_OUTPUT" "$FOUNDATION_OUTPUT_LOG" \
            terraform -chdir=infra output -json foundation
          run_private_stage "foundation-output-validation" "$FOUNDATION_VALIDATE_LOG" "$FOUNDATION_VALIDATE_LOG" \
            jq -e '
            def exact_keys($keys): type == "object" and ((keys_unsorted | sort) == ($keys | sort));
            . as $foundation |
            exact_keys(["vpc_id", "vpc_cidr_block", "private_subnet_ids", "rds_security_group_id", "agentcore_endpoint_security_group_id", "eventbridge_endpoint_security_group_id", "agentcore_vpc_endpoint_id", "agentcore_vpc_endpoint_dns_name", "tollchat_api_vpc_endpoint_id", "raw_bucket_name", "raw_kms_key_arn", "agentcore_artifacts_bucket_name", "db_instance", "alerts_topic_arn"])
            and all(["vpc_id", "vpc_cidr_block", "rds_security_group_id", "agentcore_endpoint_security_group_id", "eventbridge_endpoint_security_group_id", "agentcore_vpc_endpoint_id", "agentcore_vpc_endpoint_dns_name", "tollchat_api_vpc_endpoint_id", "raw_bucket_name", "raw_kms_key_arn", "agentcore_artifacts_bucket_name", "alerts_topic_arn"][]; $foundation[.] | type == "string" and length > 0)
            and ($foundation.private_subnet_ids | exact_keys(["a", "c"]) and all(.[]; type == "string" and length > 0))
            and ($foundation.db_instance | exact_keys(["identifier", "resource_id", "address", "port"]) and all(["identifier", "resource_id", "address"][]; $foundation.db_instance[.] | type == "string" and length > 0) and (.port | type == "number"))
          ' "$FOUNDATION_OUTPUT"
          run_private_stage "foundation-vars" "$FOUNDATION_VARS" "$FOUNDATION_VARS_LOG" \
            jq -n --slurpfile foundation "$FOUNDATION_OUTPUT" '{foundation: $foundation[0]}'
          chmod 600 -- "$FOUNDATION_VARS"
          printf '%s\n' '{"provider":"hashicorp/aws","provider_version":"6.60.0","terraform_version":"1.15.8","lockfile":"v2/infra/.terraform.lock.hcl","lock_identity":"V2-AWS60"}' >"$IDENTITY"
          chmod 600 -- "$IDENTITY"

          run_private_stage "release-init" "$APPLICATION_INIT_LOG" "$APPLICATION_INIT_LOG" \
            terraform -chdir="$RELEASE_ROOT/v2/infra" init -input=false -lockfile=readonly \
            -backend-config=backend.development.hcl
          run_private_stage "plan" "$PLAN_LOG" "$PLAN_LOG" \
            terraform -chdir="$RELEASE_ROOT/v2/infra" plan -input=false -out="$PLAN" \
            -var-file=development.tfvars \
            -var-file="$FOUNDATION_VARS" \
            -var loader_package_path="$PACKAGE_DIR/loader.zip" \
            -var publisher_package_path="$PACKAGE_DIR/publisher.zip" \
            -var agentcore_package_path="$PACKAGE_DIR/agentcore.zip" \
            -var chat_proxy_package_path="$PACKAGE_DIR/chat-proxy.zip"

          run_private_stage "show" "$PLAN_JSON" "$SHOW_LOG" \
            terraform -chdir="$RELEASE_ROOT/v2/infra" show -json "$PLAN"
          MANIFEST_VALID=true
          IDENTITY_VALID=true
          test -f "$MANIFEST" && test ! -L "$MANIFEST" && test -r "$MANIFEST" || MANIFEST_VALID=false
          test -f "$IDENTITY" && test ! -L "$IDENTITY" && test -r "$IDENTITY" || IDENTITY_VALID=false
          PRIVATE_STAGE_FALLBACK_STAGE=validator
          if run_private_stage "validator" "$VALIDATION" "$VALIDATOR_LOG" \
            python3 infra/delivery_plan_validator.py "$PLAN_JSON" "$MANIFEST" --identity "$IDENTITY"; then
            VALIDATOR_STATUS=0
          else
            VALIDATOR_STATUS=$?
          fi
          if run_private_stage "validator" "$VALIDATION_SUMMARY" "$VALIDATOR_PARSE_LOG" jq -e '
            def valid_reason:
              .reason_code as $reason |
              ["data_mode_misuse", "delete_not_permitted", "deposed_resource", "duplicate_address", "duplicate_manifest_mutation", "duplicate_permission", "import_or_refresh", "invalid_permission", "invalid_resource_identity", "malformed_input", "manifest_coverage_mismatch", "manifest_mutation_mismatch", "missing_permission", "moved_resource", "production_target", "provider_identity_mismatch", "provider_identity_missing", "replacement", "sensitive_authorization_value", "unknown_authorization_value", "unknown_manifest_declaration", "unsupported_action", "unsupported_address", "unsupported_field_delta"]
              | index($reason) != null;
            def valid_result:
            type == "object" and
            ((.status == "accepted" and .reason_code == "ok" and
              (keys_unsorted | sort) == ["actions", "addresses", "fingerprint", "operation_classes", "reason_code", "status"] and
              (.addresses | type == "array" and all(.[]; type == "string" and length <= 128)) and
              (.actions | type == "array" and all(.[]; type == "string" and length <= 32)) and
              (.operation_classes | type == "array" and all(.[]; type == "string" and length <= 64)) and
              (.fingerprint | type == "string" and test("^[0-9a-f]{64}$"))) or
             (.status == "rejected" and valid_reason and
              (keys_unsorted | all(.[]; . as $key | ["action", "address", "operation_class", "reason_code", "status"] | index($key) != null)) and
              (.address? == null or (.address | type == "string" and length <= 128)) and
              (.action? == null or (.action | type == "string" and length <= 32)) and
              (.operation_class? == null or (.operation_class | type == "string" and length <= 64))));
            select(valid_result) | {status, reason_code}
          ' "$VALIDATION"; then
            VALIDATOR_PARSE_STATUS=0
          else
            VALIDATOR_PARSE_STATUS=$?
          fi
          if test "$VALIDATOR_PARSE_STATUS" -ne 0; then
            exit "$VALIDATOR_PARSE_STATUS"
          fi
          if ! cat "$VALIDATION_SUMMARY" >&2; then
            _run_private_stage_emit 'stage=validator status=fail elapsed=0 exit=125 reason=diagnostic_unavailable'
            PRIVATE_STAGE_REPORTED=1
            exit 125
          fi
          if ! (cat "$VALIDATION_SUMMARY" >>"$VALIDATOR_PARSE_LOG") 2>/dev/null; then
            _run_private_stage_emit 'stage=validator status=fail elapsed=0 exit=125 reason=unclassified'
            PRIVATE_STAGE_REPORTED=1
            exit 125
          fi
          if test -z "${GITHUB_STEP_SUMMARY:-}" || ! (cat "$VALIDATION_SUMMARY" >>"$GITHUB_STEP_SUMMARY") 2>/dev/null; then
            _run_private_stage_emit 'stage=validator status=fail elapsed=0 exit=125 reason=unclassified'
            PRIVATE_STAGE_REPORTED=1
            exit 125
          fi
          set +e
          VALIDATOR_RESULT_STATUS="$(jq -er '.status' "$VALIDATION_SUMMARY" 2>"$VALIDATOR_PARSE_LOG")"
          VALIDATOR_RESULT_STATUS_CODE=$?
          set -e
          if test "$VALIDATOR_RESULT_STATUS_CODE" -ne 0; then
            _run_private_stage_emit "stage=validator status=fail elapsed=0 exit=$VALIDATOR_RESULT_STATUS_CODE reason=malformed_input"
            PRIVATE_STAGE_REPORTED=1
            exit "$VALIDATOR_RESULT_STATUS_CODE"
          fi
          if test "$MANIFEST_VALID" != true || test "$IDENTITY_VALID" != true; then
            _run_private_stage_emit 'stage=validator status=fail elapsed=0 exit=1 reason=malformed_input'
            PRIVATE_STAGE_REPORTED=1
            exit 1
          fi
          if test "$VALIDATOR_RESULT_STATUS" != accepted; then
            if test "$VALIDATOR_STATUS" -eq 0; then
              _run_private_stage_emit 'stage=validator status=fail elapsed=0 exit=1 reason=unclassified'
              PRIVATE_STAGE_REPORTED=1
              exit 1
            fi
            PRIVATE_STAGE_REPORTED=1
            exit "$VALIDATOR_STATUS"
          fi
          if test "$VALIDATOR_STATUS" -ne 0; then
            PRIVATE_STAGE_REPORTED=1
            exit "$VALIDATOR_STATUS"
          fi
          chmod 600 -- "$PLAN" "$PLAN_JSON" "$FOUNDATION_VARS"

      - name: Fetch pinned RDS CA bundle for automatic migrations
        run: |
          set -euo pipefail
          set +x
          source v2/scripts/run_private_stage.sh
          fetch_rds_ca() {
          set -euo pipefail
          mkdir -p v2/infra/build/ca
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o v2/infra/build/ca/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  v2/infra/build/ca/rds-ca-bundle.pem" | sha256sum --check --status
          chmod 600 v2/infra/build/ca/rds-ca-bundle.pem
          }
          run_private_stage "rds-ca" "$RUNNER_TEMP/development-rds-ca.log" "$RUNNER_TEMP/development-rds-ca.log" \
            fetch_rds_ca

      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_DEVELOPMENT_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_DEVELOPMENT_OAUTH_SECRET }}
          tags: tag:ci-development

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-migrations-dev
          aws-region: us-east-1
          unset-current-credentials: true

      - name: Run reviewed backward-compatible development migrations
        run: bash v2/scripts/run_development_migrations_workflow.sh

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-delivery
          aws-region: us-east-1
          unset-current-credentials: true

      - name: Confirm delivery role before applying saved plan
        run: |
          set -euo pipefail
          source v2/scripts/run_private_stage.sh
          confirm_delivery_role() {
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "903859731897"
          case "$(aws sts get-caller-identity --query Arn --output text)" in
            arn:aws:sts::903859731897:assumed-role/nova-toll-v2-development-delivery/*) ;;
            *) exit 1 ;;
          esac
          }
          run_private_stage "delivery-role" "$RUNNER_TEMP/development-delivery-role.log" "$RUNNER_TEMP/development-delivery-role.log" \
            confirm_delivery_role

      - name: Apply the same saved development plan
        run: |
          set -euo pipefail
          umask 077
          source v2/scripts/run_private_stage.sh
          PRIVATE_STAGE_REPORTED=0
          PRIVATE_STAGE_FALLBACK_STAGE=apply
          private_stage_fallback() {
            local status=$?
            if test "$status" -ne 0 && test "$PRIVATE_STAGE_REPORTED" -eq 0; then
              _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
            fi
            trap - EXIT
            exit "$status"
          }
          trap private_stage_fallback EXIT
          RELEASE_ROOT="$RUNNER_TEMP/release-overlay"
          PLAN="$RUNNER_TEMP/development.tfplan"
          TF_LOG_DIR="$RUNNER_TEMP/development-terraform-logs"
          APPLY_LOG="$TF_LOG_DIR/apply.log"
          run_private_stage "plan-artifact-cleanup" "$RUNNER_TEMP/development-plan-cleanup.log" "$RUNNER_TEMP/development-plan-cleanup.log" \
            test -s "$PLAN"
          run_private_stage "apply" "$APPLY_LOG" "$APPLY_LOG" \
            terraform -chdir="$RELEASE_ROOT/v2/infra" apply -input=false "$PLAN"
          run_private_stage "plan-artifact-cleanup" "$RUNNER_TEMP/development-plan-cleanup.log" "$RUNNER_TEMP/development-plan-cleanup.log" \
            rm -f -- "$RUNNER_TEMP/foundation.tfvars.json" "$RUNNER_TEMP/foundation-output.json" "$PLAN" "$RUNNER_TEMP/development.tfplan.json"
          run_private_stage "plan-artifact-cleanup" "$RUNNER_TEMP/development-plan-cleanup.log" "$RUNNER_TEMP/development-plan-cleanup.log" \
            rm -rf -- "$TF_LOG_DIR"

      - name: Verify readiness and public release path
        id: verify-release
        run: |
          set -euo pipefail
          set +x
          umask 077
          source v2/scripts/run_private_stage.sh
          PRIVATE_STAGE_REPORTED=0
          PRIVATE_STAGE_FALLBACK_STAGE=readiness-state
          state="$RUNNER_TEMP/development-readiness-state.json"
          error_log="$RUNNER_TEMP/development-readiness-state.log"
          cleanup_log="$RUNNER_TEMP/development-readiness-cleanup.log"
          readiness_cleanup() {
            local status=$?
            local cleanup_status=0
            local primary_reported="$PRIVATE_STAGE_REPORTED"
            if run_private_stage "cleanup" "$cleanup_log" "$cleanup_log" \
              rm -f -- "$state" "$error_log"; then
              :
            else
              cleanup_status=$?
            fi
            if test "$status" -eq 0 && test "$cleanup_status" -ne 0; then
              status="$cleanup_status"
              primary_reported=1
            fi
            if test "$status" -ne 0 && test "$primary_reported" -eq 0; then
              _run_private_stage_emit "stage=$PRIVATE_STAGE_FALLBACK_STAGE status=fail elapsed=0 exit=$status reason=unclassified"
            fi
            trap - EXIT
            exit "$status"
          }
          trap readiness_cleanup EXIT
          run_private_stage "readiness-state" "$state" "$error_log" \
            terraform -chdir="$RUNNER_TEMP/release-overlay/v2/infra" show -json
          PRIVATE_STAGE_FALLBACK_STAGE=readiness-check
          python3 v2/scripts/check_development_release.py \
            "$state" "$RUNNER_TEMP/release-overlay/release-manifest.json"
          echo 'verified=success' >>"$GITHUB_OUTPUT"

      - name: Cleanup private delivery files
        if: always()
        run: |
          set +e
          source v2/scripts/run_private_stage.sh
          cleanup_log="$RUNNER_TEMP/development-cleanup.log"
          cleanup_status=0
          cleanup_path() {
            run_private_stage "cleanup" "$cleanup_log" "$cleanup_log" rm -rf -- "$1"
            status=$?
            if test "$status" -ne 0 && test "$cleanup_status" -eq 0; then
              cleanup_status="$status"
            fi
          }
          for private_path in \
            "$RUNNER_TEMP/v2-development-packages" \
            "$RUNNER_TEMP/v2-development-checksums" "$RUNNER_TEMP/release-overlay" \
            "$RUNNER_TEMP/development-terraform-logs" \
            "$RUNNER_TEMP/foundation.tfvars.json" "$RUNNER_TEMP/development-foundation-output.json" \
            "$RUNNER_TEMP/development-foundation-init.log" "$RUNNER_TEMP/development-foundation-output.log" \
            "$RUNNER_TEMP/development-application-init.log" "$RUNNER_TEMP/development.tfplan" \
            "$RUNNER_TEMP/development.tfplan.log" "$RUNNER_TEMP/development.tfplan.json" \
            "$RUNNER_TEMP/development.tfshow.log" "$RUNNER_TEMP/development-apply.log" \
            "$RUNNER_TEMP/development-foundation-validate.log" "$RUNNER_TEMP/development-plan-identity.json" \
            "$RUNNER_TEMP/development-release-manifest.json" "$RUNNER_TEMP/development-plan-validation.json" \
            "$RUNNER_TEMP/development-release-staging-verification.json" "$RUNNER_TEMP/development-plan-validation-summary.json" \
            "$RUNNER_TEMP/development-release-verification.json" "$RUNNER_TEMP/v2-development-migrations-evidence.json" \
            "$RUNNER_TEMP/development-readiness-state.json" "$RUNNER_TEMP/development-readiness-state.log" \
            "$RUNNER_TEMP/development-readiness-cleanup.log" \
            "$RUNNER_TEMP/development-plan-cleanup.log" "$RUNNER_TEMP/development-migration-stage.stdout" \
            "$RUNNER_TEMP/development-migration-stage.stderr" "$RUNNER_TEMP/development-migration-control.stdout" \
            "$RUNNER_TEMP/development-migration-summary.log" \
            "$RUNNER_TEMP/development-artifact-build.log" "$RUNNER_TEMP/development-artifact-metadata.log" \
            "$RUNNER_TEMP/development-build-cleanup.log" "$RUNNER_TEMP/development-release-identity.log" \
            "$RUNNER_TEMP/development-artifact-download.log" "$RUNNER_TEMP/development-staging-verification.log" \
            "$RUNNER_TEMP/development-oidc-validation.log" "$RUNNER_TEMP/development-account-identity.log" \
            "$RUNNER_TEMP/development-rds-ca.log" "$RUNNER_TEMP/development-delivery-role.log" \
            "$GITHUB_WORKSPACE/infra/.terraform" "$GITHUB_WORKSPACE/v2/infra/.terraform" \
            "$GITHUB_WORKSPACE/v2/infra/build/ca" \
            "$RUNNER_TEMP/protected-main-oidc.json"; do
            cleanup_path "$private_path"
          done
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
          cleanup_path "$cleanup_log"
          exit "$cleanup_status"

  release-result:
    name: Record end-to-end development result
    needs: [admission, release-record, build, oidc-proof, deploy]
    if: always() && needs.admission.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish sanitized release outcome
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 v2/scripts/development_deployment_status.py finish
