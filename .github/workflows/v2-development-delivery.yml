              "aws_s3_bucket_server_side_encryption_configuration.agent_measurement",
              "aws_sqs_queue.delivery_failure", "aws_sqs_queue.invoke_failure",
              "aws_sqs_queue.publisher_delivery_failure", "aws_sqs_queue.publisher_invoke_failure",
              "aws_sqs_queue_policy.delivery_failure",
              "aws_security_group.loader", "aws_security_group.publisher",
              "aws_security_group.tollchat_proxy", "aws_security_group.tollchat_runtime",
              "aws_vpc_security_group_egress_rule.loader_to_eventbridge",
              "aws_vpc_security_group_egress_rule.loader_to_rds",
              "aws_vpc_security_group_egress_rule.loader_to_s3",
              "aws_vpc_security_group_egress_rule.proxy_https",
              "aws_vpc_security_group_egress_rule.proxy_to_dynamodb",
              "aws_vpc_security_group_egress_rule.publisher_to_rds",
              "aws_vpc_security_group_egress_rule.publisher_to_s3",
              "aws_vpc_security_group_egress_rule.runtime_https",
              "aws_vpc_security_group_egress_rule.runtime_to_rds",
              "aws_vpc_security_group_ingress_rule.agentcore_from_proxy",
              "aws_vpc_security_group_ingress_rule.rds_from_loader",
              "aws_vpc_security_group_ingress_rule.rds_from_publisher",
              "aws_vpc_security_group_ingress_rule.rds_from_runtime",
          }
          immutable = {
              "aws_api_gateway_deployment.tollchat": {
                  ("create",), ("delete",), ("create", "delete"), ("delete", "create")
              },
              "aws_bedrock_guardrail_version.tollchat": {("create",)},
          }
          try:
              with open(sys.argv[1], encoding="utf-8") as plan_file:
                  plan = json.load(plan_file)
              changes = plan["resource_changes"]
              if not isinstance(changes, list):
                  raise ValueError("missing resource_changes")
              for change in changes:
                  if "deposed" in change or "previous_address" in change:
                      raise ValueError("moved/deposed change")
                  address = change["address"]
                  mode = change["mode"]
                  actions = tuple(change["change"]["actions"])
                  base = address.split("[", 1)[0]
                  values = []
                  pending = [change]
                  while pending:
                      value = pending.pop()
                      if isinstance(value, dict):
                          pending.extend(value.values())
                      elif isinstance(value, list):
                          pending.extend(value)
                      elif isinstance(value, str):
                          values.append(value.lower())
                  if any(
                      token in value
                      for value in values
                      for token in ("920534" + "282028", "terraform.tfstate", "backend.production", "prod" + "uction", "route53")
                  ):
                      raise ValueError("production or external value")
                  if mode == "data":
                      allowed = base in known_data and actions in {("read",), ("no-op",)}
                  elif mode == "managed":
                      allowed = base in known_managed and (
                          actions in {("no-op",)}
                          or (actions == ("update",) and base not in read_only)
                          or actions in immutable.get(base, set())
                      )
                  else:
                      allowed = False
                  if not allowed:
                      raise ValueError(f"rejected {mode} {address} {actions}")
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
              print(f"development plan gate failed closed: {error}", file=sys.stderr)
              raise SystemExit(1)
          PY

          terraform -chdir=v2/infra apply -input=false "$PLAN"
