name: ci
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python scripts/check_agent_contract_versions.py "$AGENT_CONTRACT_BASE_REF"
        env:
          AGENT_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python eval/deterministic/fuzzy_location_matching/deterministic_fuzzy_location_matching.py --check
      - run: uv run python eval/deterministic/ny_time_us_format/deterministic_ny_time_us_format.py --check
      - run: uv run python eval/deterministic/i95_historical_closures/deterministic_i95_historical_closures.py --check
      - run: uv run python eval/deterministic/single_leg_base_cases/deterministic_single_leg_base_cases.py --check
      - run: uv run python eval/deterministic/i95_i495_junctions/deterministic_i95_i495_junctions.py --check
      - run: uv run python eval/simulated/simulated_user_i95_historical_closures.py --check
      - run: uv run python eval/simulated/simulated_user_single_leg_base_cases.py --check
      - run: uv run python eval/simulated/simulated_user_i95_i495_junctions.py --check
      - run: for f in agent-sops/*.sop.md; do scripts/validate-sop.sh "$f"; done

  integration:
    runs-on: ubuntu-latest
    # Skip PRs from forks: they'd still get an OIDC token whose sub claim
    # matches nova-toll-github-ci's trust policy (repo:OWNER/REPO:pull_request
    # is the same shape regardless of fork), so this check -- not the trust
    # policy -- is what actually keeps a random fork PR from touching prod
    # RDS. Dependabot has its own GitHub secret store, so it cannot receive
    # the Tailscale OAuth credentials this job requires; regular CI still
    # validates its dependency updates without exposing deployment access.
    # Run paid integration once per SHA: feature branches use their internal
    # PR event; main uses its push event. github.event.pull_request fields are
    # event-payload data, not attacker-controlled string interpolation.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # infra/build/ is gitignored (scripts/build_zips.sh's output) -- fetch
      # just the CA bundle piece of it here, same URL + pinned hash as that
      # script uses for the loader Lambda zip.
      - name: Fetch RDS CA bundle
        run: |
          mkdir -p infra/build/loader
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o infra/build/loader/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  infra/build/loader/rds-ca-bundle.pem" | sha256sum --check --status
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-github-ci
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -m live tests/test_ci_rds_connectivity.py tests/test_ci_rds_route_tools.py
        env:
          DB_USER: pricing_reader
          DB_NAME: nova_toll
          DB_CA_BUNDLE_PATH: infra/build/loader/rds-ca-bundle.pem
      - run: uv run python eval/deterministic/single_leg_base_cases/deterministic_single_leg_base_cases.py
      - run: env -u OPENAI_BASE_URL uv run python eval/deterministic/i95_i495_junctions/deterministic_i95_i495_junctions.py
