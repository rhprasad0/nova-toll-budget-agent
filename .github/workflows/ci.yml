name: ci
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  golden-artifact-smoke:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.1'
      - run: uv sync --frozen
      - run: ./scripts/build_agentcore_zips.sh
      - name: Run packaged agent with a canned provider and frozen replay
        run: uv run python -m tests.golden_artifact_smoke infra/build/agentcore
  v2-loader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject em dashes in front-end copy
        run: >-
          ! git grep -n '—' --
          'agent/*.html' 'agent/*.mjs' 'agent/*.js' 'agent/*.json' 'agent/*.txt'
          ':(exclude)agent/assets/LICENSE.txt'
          ':(exclude)agent/assets/markdown-it.esm.min.mjs'
          ':(exclude)agent/assets/maplibre-gl-6.0.0/**'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.8"
      - name: Reuse providers within this job
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-provider-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-provider-cache" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: |
            v2/package-lock.json
            v2/lambdas/chat_proxy/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix lambdas/chat_proxy
      - name: Install pinned shell, workflow and secret checkers
        run: |
          ./scripts/install_check_tools.sh "$RUNNER_TEMP/repository-check-tools"
          echo "$RUNNER_TEMP/repository-check-tools" >> "$GITHUB_PATH"
      - name: Check all authored code
        run: python3 scripts/check_repository.py
      - name: Validate development golden corpus and release isolation
        run: |
          uv run python -m eval.golden
          uv run pytest -q tests/test_golden_retirement.py tests/test_golden_development.py
          uv run python ../.agents/skills/eval-climb/scripts/test_compare_runs.py
      - run: uv run python scripts/check_tool_contract_versions.py "$TOOL_CONTRACT_BASE_REF"
        env:
          TOOL_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - run: uv run python -m scripts.check_agent_contract_versions "$AGENT_CONTRACT_BASE_REF"
        env:
          AGENT_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - run: uv run coverage run -m pytest --durations=30 --durations-min=1
      - run: uv run coverage report
      - run: node --test tests/*.mjs
      - if: github.event_name != 'pull_request'
        run: npm ci --prefix lambdas/chat_proxy
      - run: uv run python oracle/build_oracle_data.py --check
      # Main delivery owns the immutable release bundle; PRs retain package checks.
      - if: github.event_name == 'pull_request'
        run: ./scripts/build_fetcher_zip.sh
      - if: github.event_name == 'pull_request'
        run: ./scripts/build_loader_zip.sh
      - if: github.event_name == 'pull_request'
        run: ./scripts/build_publisher_zip.sh
      - if: github.event_name == 'pull_request'
        run: ./scripts/build_agentcore_zips.sh
      - run: npm test --prefix lambdas/chat_proxy
      - if: github.event_name == 'pull_request'
        run: ./scripts/build_timed_checks_zip.sh

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select frontend changes
        id: changes
        working-directory: .
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null &&
            git diff --quiet "$BASE_REF" HEAD -- .github/workflows/ci.yml \
              v2/agent 'v2/package*.json' 'v2/tests/*browser.cjs' v2/tests/fixtures \
              v2/tests/test_frontend_browser_ci.py; then
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - if: steps.changes.outputs.frontend == 'true'
        run: npm ci --ignore-scripts
      - name: Install Chromium and Firefox
        id: browsers
        if: steps.changes.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser and end-to-end checks with local fixtures
        if: steps.changes.outputs.frontend == 'true'
        run: |
          status=0
          for check in eval_dashboard cost_dashboard public_chat_scroll commute_map frontend_e2e; do
            node "tests/${check}_browser.cjs" || status=1
          done
          exit "$status"
      - name: Check candidate chat against the deployed development AI
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        run: node tests/deployed_chat_browser.cjs
      - name: Upload browser screenshots and traces
        if: always() && steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  v2-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ponytail: both services start for fast profiles; create the second on demand if startup becomes material.
      postgres_retained:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: python3 v2/scripts/check_schema_versions.py "$SCHEMA_BASE_REF"
      - name: Select database test profile
        id: database-profile
        env:
          PROFILE_EVENT: ${{ github.event_name }}
          PROFILE_REF: ${{ github.ref }}
          PROFILE_HEAD: ${{ github.sha }}
        run: |
          profile="$(python3 v2/scripts/select_db_test_profile.py \
            --event "$PROFILE_EVENT" --ref "$PROFILE_REF" \
            --base "$SCHEMA_BASE_REF" --head "$PROFILE_HEAD")"
          printf 'profile=%s\n' "$profile" >>"$GITHUB_OUTPUT"
      - name: Validate disposable database contracts
        run: |
          if [[ "$DATABASE_PROFILE" == full ]]; then
            PGPORT=5433 POSTGRES_CONTAINER_ID="$RETAINED_POSTGRES_CONTAINER_ID" \
              DB_CONTRACT_IDENTITY=retained \
              v2/scripts/run_db_tests.sh "$SCHEMA_BASE_REF" --profile "$DATABASE_PROFILE" \
              >"$RUNNER_TEMP/retained-database.log" 2>&1 &
            retained_pid=$!
            status=0
            DB_CONTRACT_IDENTITY=candidate \
              v2/scripts/run_db_tests.sh "$SCHEMA_BASE_REF" --profile "$DATABASE_PROFILE" || status=$?
            wait "$retained_pid" || status=$?
            cat "$RUNNER_TEMP/retained-database.log"
            exit "$status"
          fi
          v2/scripts/run_db_tests.sh "$SCHEMA_BASE_REF" --profile "$DATABASE_PROFILE"
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          RETAINED_POSTGRES_CONTAINER_ID: ${{ job.services.postgres_retained.id }}
          DATABASE_PROFILE: ${{ steps.database-profile.outputs.profile }}
          DB_CONTRACT_IDENTITY: all

  trusted-development-plan:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && vars.DEVELOPMENT_BLUE_GREEN_BOOTSTRAPPED == 'true'
    uses: rhprasad0/nova-toll-budget-agent/.github/workflows/v2-development-plan.yml@main
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    permissions:
      contents: read
      id-token: write

  development-plan:
    if: always()
    needs: trusted-development-plan
    runs-on: ubuntu-latest
    steps:
      - name: Require successful trusted development plan
        env:
          CALL_RESULT: ${{ needs.trusted-development-plan.result }}
          PLAN_RESULT: ${{ needs.trusted-development-plan.outputs.plan_result }}
          BOOTSTRAPPED: ${{ vars.DEVELOPMENT_BLUE_GREEN_BOOTSTRAPPED }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
            exit 0
          fi
          if [[ "$BOOTSTRAPPED" != true ]]; then
            test "$CALL_RESULT" = skipped
            echo 'Deployed planning awaits the separately reviewed blue-green bootstrap; credential-free tests and package builds remain required.'
            exit 0
          fi
          test "$CALL_RESULT" = success
          test "$PLAN_RESULT" = success
