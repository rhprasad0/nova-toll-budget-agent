name: ci
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
        if: hashFiles('**/test_*.py') != ''

  integration:
    runs-on: ubuntu-latest
    # Skip PRs from forks: they'd still get an OIDC token whose sub claim
    # matches nova-toll-github-ci's trust policy (repo:OWNER/REPO:pull_request
    # is the same shape regardless of fork), so this check -- not the trust
    # policy -- is what actually keeps a random fork PR from touching prod
    # RDS. github.event.pull_request.head.repo.full_name is event-payload
    # data, not attacker-controlled string interpolation, so it's safe here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # infra/build/ is gitignored (scripts/build_zips.sh's output) -- fetch
      # just the CA bundle piece of it here, same URL + pinned hash as that
      # script uses for the loader Lambda zip.
      - name: Fetch RDS CA bundle
        run: |
          mkdir -p infra/build/loader
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o infra/build/loader/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  infra/build/loader/rds-ca-bundle.pem" | sha256sum --check --status
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-github-ci
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync
      - run: uv run pytest -m live tests/test_ci_rds_connectivity.py tests/test_ci_rds_route_tools.py
        env:
          DB_USER: pricing_reader
          DB_NAME: nova_toll
          DB_CA_BUNDLE_PATH: infra/build/loader/rds-ca-bundle.pem
