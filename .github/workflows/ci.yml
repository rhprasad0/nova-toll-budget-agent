name: ci
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  trusted-toolchain-provenance:
    uses: rhprasad0/nova-toll-budget-agent/.github/workflows/toolchain-provenance.yml@main
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    permissions:
      contents: read
      attestations: read

  toolchain-provenance:
    if: always()
    needs: trusted-toolchain-provenance
    runs-on: ubuntu-latest
    steps:
      - name: Require main's toolchain provenance check to pass
        env:
          CALL_RESULT: ${{ needs.trusted-toolchain-provenance.result }}
        run: test "$CALL_RESULT" = success

  v2-loader:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rhprasad0/nova-toll-budget-agent/toolchain@sha256:55f9efde563122cda78c9fdba2b385aef1db7e2e732d404f4d5570e879fa6e6f
      options: --user root
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reuse providers within this job
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-provider-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-provider-cache" >> "$GITHUB_ENV"
      # Every check lives in the script so a local or sandbox run matches CI.
      - name: Run the credential-free checks
        run: ../.github/scripts/verify.sh loader "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/rhprasad0/nova-toll-budget-agent/toolchain@sha256:55f9efde563122cda78c9fdba2b385aef1db7e2e732d404f4d5570e879fa6e6f
      options: --user 1001
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select frontend changes
        id: changes
        working-directory: .
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null &&
            git diff --quiet "$BASE_REF" HEAD -- .github/workflows/ci.yml \
              v2/agent 'v2/package*.json' 'v2/tests/*browser.cjs' v2/tests/fixtures \
              v2/tests/test_frontend_browser_ci.py; then
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.frontend == 'true'
        run: npm ci --ignore-scripts
      - name: Run browser and end-to-end checks with local fixtures
        if: steps.changes.outputs.frontend == 'true'
        run: |
          status=0
          for check in cost_dashboard release_dashboard public_chat_scroll commute_map frontend_e2e; do
            node "tests/${check}_browser.cjs" || status=1
          done
          exit "$status"
      - name: Check candidate chat against the deployed development AI
        if: ${{ !cancelled() && steps.changes.outputs.frontend == 'true' }}
        timeout-minutes: 5
        run: node tests/deployed_chat_browser.cjs
      - name: Upload browser screenshots and traces
        if: always() && steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  v2-database:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rhprasad0/nova-toll-budget-agent/toolchain@sha256:55f9efde563122cda78c9fdba2b385aef1db7e2e732d404f4d5570e879fa6e6f
      options: --user root
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ponytail: both services start for fast profiles; create the second on demand if startup becomes material.
      postgres-retained:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      RETAINED_PGHOST: postgres-retained
      RETAINED_PGPORT: 5432
      SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate schema versions and disposable database contracts
        run: .github/scripts/verify.sh database "$SCHEMA_BASE_REF"
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          RETAINED_POSTGRES_CONTAINER_ID: ${{ job.services.postgres-retained.id }}
          DISPOSABLE_DOCKER_NETWORK: container:${{ job.container.id }}

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/rhprasad0/nova-toll-budget-agent/toolchain@sha256:55f9efde563122cda78c9fdba2b385aef1db7e2e732d404f4d5570e879fa6e6f
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Factory dispatcher checks
        run: .github/scripts/verify.sh factory

  trusted-development-plan:
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && vars.DEVELOPMENT_BLUE_GREEN_BOOTSTRAPPED == 'true'
    uses: rhprasad0/nova-toll-budget-agent/.github/workflows/v2-development-plan.yml@main
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    permissions:
      contents: read
      id-token: write

  development-plan:
    if: always()
    needs: trusted-development-plan
    runs-on: ubuntu-latest
    steps:
      - name: Require successful trusted development plan
        env:
          CALL_RESULT: ${{ needs.trusted-development-plan.result }}
          PLAN_RESULT: ${{ needs.trusted-development-plan.outputs.plan_result }}
          BOOTSTRAPPED: ${{ vars.DEVELOPMENT_BLUE_GREEN_BOOTSTRAPPED }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
            exit 0
          fi
          if [[ "$BOOTSTRAPPED" != true ]]; then
            test "$CALL_RESULT" = skipped
            echo 'Deployed planning awaits the separately reviewed blue-green bootstrap; credential-free tests and package builds remain required.'
            exit 0
          fi
          test "$CALL_RESULT" = success
          test "$PLAN_RESULT" = success
