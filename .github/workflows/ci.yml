name: ci
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  v2-loader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject em dashes in front-end copy
        run: >-
          ! git grep -n '—' --
          'agent/*.html' 'agent/*.mjs' 'agent/*.js' 'agent/*.json' 'agent/*.txt'
          ':(exclude)agent/assets/LICENSE.txt'
          ':(exclude)agent/assets/markdown-it.esm.min.mjs'
          ':(exclude)agent/assets/maplibre-gl-6.0.0/**'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          terraform_version: "1.15.8"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python eval/run_evaluation.py --check
      - run: uv run python scripts/check_tool_contract_versions.py "$TOOL_CONTRACT_BASE_REF"
        env:
          TOOL_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: uv run python -m scripts.check_agent_contract_versions "$AGENT_CONTRACT_BASE_REF"
        env:
          AGENT_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - run: node --test tests/*.mjs
      - run: npm ci --prefix lambdas/chat_proxy
      - run: npm test --prefix lambdas/chat_proxy
      - run: uv run python oracle/build_oracle_data.py --check
      - run: ./scripts/build_fetcher_zip.sh
      - run: ./scripts/build_loader_zip.sh
      - run: ./scripts/build_publisher_zip.sh
      - run: ./scripts/build_agentcore_zips.sh

  v2-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 v2/scripts/check_schema_versions.py "$SCHEMA_BASE_REF"
      - run: v2/scripts/run_db_tests.sh "$SCHEMA_BASE_REF"
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
