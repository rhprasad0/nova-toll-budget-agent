name: v2 development migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Run development migrations
    if: github.ref == 'refs/heads/main' && github.actor_id == '91573985' && github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: v2-development-apply
      queue: max
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned RDS CA bundle
        run: |
          set -euo pipefail
          set +x
          mkdir -p infra/build/ca
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o infra/build/ca/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  infra/build/ca/rds-ca-bundle.pem" | sha256sum --check --status
          chmod 600 infra/build/ca/rds-ca-bundle.pem

      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_DEVELOPMENT_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_DEVELOPMENT_OAUTH_SECRET }}
          tags: tag:ci-development

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::903859731897:role/nova-toll-v2-development-migrations-dev
          aws-region: us-east-1

      - name: Run fixed-target migrations and emit sanitized evidence
        env:
          EXPECTED_PRICING_VERSION: "1.3.0"
          EXPECTED_ORACLE_VERSION: "1.14.0"
        run: bash scripts/run_development_migrations_workflow.sh

      - name: Upload sanitized migration evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-development-migrations-evidence
          path: ${{ runner.temp }}/v2-development-migrations-evidence.json
          if-no-files-found: error
          retention-days: 7
