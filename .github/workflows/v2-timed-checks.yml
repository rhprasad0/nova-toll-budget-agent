name: v2 reusable timed checks

on:
  workflow_call:
    inputs:
      schedule:
        description: Cron schedule for freshness checks; empty for manual dispatches
        required: false
        type: string
      window_id:
        description: Stable identifier shared by every check in this timed window
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true

permissions:
  contents: read

env:
  TIMED_WINDOW_ID: ${{ inputs.window_id }}

jobs:
  route-validation:
    name: timed live check (${{ inputs.window_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch RDS CA bundle
        run: |
          mkdir -p infra/build/ca
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o infra/build/ca/rds-ca-bundle.pem
          echo "e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3  infra/build/ca/rds-ca-bundle.pem" | sha256sum --check --status
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-v2-timed-checks
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Validate live timed pricing state
        env:
          DB_CA_BUNDLE_PATH: infra/build/ca/rds-ca-bundle.pem
          DB_NAME: nova_toll
          TIMED_SCHEDULE: ${{ inputs.schedule }}
        run: |
          if freshness=$(python3 scripts/check_timed_window.py "$TIMED_SCHEDULE"); then
            uv run pytest -m live \
              tests/test_validate_toll_route_live.py \
              tests/test_get_annual_toll_ballpark_live.py \
              -v
          else
            status=$?
            if (( status != 3 )); then exit "$status"; fi
            echo "::warning title=Stale timed check::$freshness"
            printf '## Skipped stale timed check\n\n%s\n' "$freshness" >> "$GITHUB_STEP_SUMMARY"
          fi
