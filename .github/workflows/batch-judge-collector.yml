name: batch-judge-collector

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: batch-judge-collector

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::920534282028:role/nova-toll-github-nightly-eval
          aws-region: us-east-1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Reconcile terminal Batch judges
        run: |
          if ! uv run --frozen python -m eval.batch_judges collect; then
            echo "::warning::OpenAI Batch judge collection failed; this report-only workflow will retry next hour."
          fi
      - name: Save Batch judge artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch-judge-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/results/batch-judges-*.json
          if-no-files-found: ignore
          retention-days: 90
