model = "gpt-6-astra"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.0.4"]

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
config_file = "agents/explorer.toml"

[agents.pre_checker]
config_file = "agents/pre_checker.toml"

[agents.builder]
config_file = "agents/builder.toml"

[agents.checker]
config_file = "agents/checker.toml"

[agents.security_reviewer]
config_file = "agents/security_reviewer.toml"

[agents.case_miner]
config_file = "agents/case_miner.toml"

[agents.eval_runner]
config_file = "agents/eval_runner.toml"

[agents.eval_reviewer]
config_file = "agents/eval_reviewer.toml"

[agents.eval_fixer]
config_file = "agents/eval_fixer.toml"

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "python3 \"$(git rev-parse --show-toplevel)/.codex/hooks/graph-write-guard.py\" subagent-start"
async = false
timeout = 10

[[hooks.PreToolUse]]
matcher = "Bash|apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 \"$(git rev-parse --show-toplevel)/.codex/hooks/graph-write-guard.py\" pre-tool-use"
async = false
timeout = 10
