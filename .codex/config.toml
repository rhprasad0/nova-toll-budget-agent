[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.0.4"]

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
config_file = "agents/explorer.toml"

[agents.pre_checker]
config_file = "agents/pre_checker.toml"

[agents.builder]
config_file = "agents/builder.toml"

[agents.checker]
config_file = "agents/checker.toml"

[agents.security_reviewer]
config_file = "agents/security_reviewer.toml"
