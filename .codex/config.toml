[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.0.4"]

[agents]
max_threads = 6
max_depth = 1

[agents.code_explorer]
config_file = "agents/code_explorer.toml"

[agents.implementer]
config_file = "agents/implementer.toml"

[agents.verifier]
config_file = "agents/verifier.toml"
