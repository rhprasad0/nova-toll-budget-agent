[mcp_servers.context7]
command = "bash"
args = ["-c", 'set -a; context7_env="$HOME/.config/context7/env"; if [ -r "$context7_env" ]; then . "$context7_env"; fi; exec npx -y @upstash/context7-mcp@4.0.4']

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws==1.6.4", "https://aws-mcp.us-east-1.api.aws/mcp", "--profile", "nova-toll-dev"]

[mcp_servers.agentmemory]
command = "npx"
args = ["-y", "@agentmemory/mcp@0.9.29"]
env = { AGENTMEMORY_URL = "http://127.0.0.1:3111" }

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
config_file = "agents/explorer.toml"

[agents.researcher]
config_file = "agents/researcher.toml"

[agents.pre_checker]
config_file = "agents/pre_checker.toml"

[agents.builder]
config_file = "agents/builder.toml"

[agents.checker]
config_file = "agents/checker.toml"

[agents.security_reviewer]
config_file = "agents/security_reviewer.toml"

[agents.advisor]
config_file = "agents/advisor.toml"

[agents.case_miner]
config_file = "agents/case_miner.toml"

[agents.eval_runner]
config_file = "agents/eval_runner.toml"

[agents.eval_reviewer]
config_file = "agents/eval_reviewer.toml"

[agents.eval_fixer]
config_file = "agents/eval_fixer.toml"

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "python3 \"$(git rev-parse --show-toplevel)/.codex/hooks/graph-write-guard.py\" subagent-start"
async = false
timeout = 10

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 \"$(git rev-parse --show-toplevel)/.codex/hooks/graph-write-guard.py\" pre-tool-use"
async = false
timeout = 10
