http_port 3128
acl CONNECT method CONNECT
acl tls_port port 443
acl subscription dstdomain auth.openai.com chatgpt.com
http_access allow CONNECT tls_port subscription
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off
shutdown_lifetime 0 seconds
forwarded_for delete
via off
