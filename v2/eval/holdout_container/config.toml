model_provider = "private_openai"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "disabled"
check_for_update_on_startup = false
cli_auth_credentials_store = "ephemeral"

[model_providers.private_openai]
name = "OpenAI API through private proxy"
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
supports_websockets = false

[features]
apps = false
plugins = false
remote_plugin = false
plugin_sharing = false
hooks = false
memories = false
external_agent_memory_import = false
multi_agent = false
browser_use = false
computer_use = false
image_generation = false
in_app_browser = false
in_app_chat = false
skill_search = false
skill_mcp_dependency_install = false
shell_snapshot = false

[analytics]
enabled = false
[feedback]
enabled = false
[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
[memories]
generate_memories = false
use_memories = false
[history]
persistence = "none"
