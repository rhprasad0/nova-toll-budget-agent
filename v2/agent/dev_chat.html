<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TollChat v2 dev console</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif; background:#0d1117; color:#e6edf3; }
  body { max-width:960px; margin:auto; padding:2rem 1rem; }
  header,form { display:flex; align-items:center; gap:.75rem; }
  h1 { margin-right:auto; font-size:1.5rem; }
  .note,summary { color:#8b949e; }
  #transcript { display:grid; gap:1rem; margin:1.5rem 0; }
  .user-turn,.assistant-turn { margin:0; padding:1rem; border-radius:.75rem; }
  .user-turn { justify-self:end; max-width:80%; background:#1f6feb33; white-space:pre-wrap; }
  .assistant-turn { background:#21262d; overflow-wrap:anywhere; }
  .answer > :first-child { margin-top:0; } .answer > :last-child { margin-bottom:0; }
  .answer pre,details pre { overflow:auto; padding:.75rem; border-radius:.4rem; background:#010409; }
  .answer table { border-collapse:collapse; } .answer th,.answer td { padding:.4rem; border:1px solid #30363d; }
  .activities { display:grid; gap:.35rem; padding-left:1.4rem; color:#8b949e; }
  .activities li { padding-left:.25rem; } .activities li span:last-child { float:right; margin-left:1rem; }
  .activities [data-status="failed"],.error { color:#ff7b72; }
  details { margin-top:.75rem; } details pre { max-height:24rem; font-size:.8rem; white-space:pre-wrap; }
  textarea { flex:1; min-height:4rem; resize:vertical; }
  button,textarea { font:inherit; padding:.7rem; border:1px solid #30363d; border-radius:.4rem; }
  button { cursor:pointer; } button:disabled,textarea:disabled { opacity:.6; cursor:not-allowed; }
  a { color:#58a6ff; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media (max-width:600px) { body { padding:1rem .75rem; } header { align-items:flex-start; } .user-turn { max-width:90%; } }
</style>
<header>
  <h1>TollChat v2 dev console</h1>
  <button id="reset" type="button">Reset chat</button>
</header>
<p class="note">Loopback-only. Conversations live in memory until reset or server restart; expand the Strands event inspector on any response for raw events.</p>
<main id="transcript" aria-label="Chat transcript"></main>
<form id="chat">
  <label class="sr-only" for="message">Message</label>
  <textarea id="message" required maxlength="8000" placeholder="Ask about a current or annual Northern Virginia toll 👋"></textarea>
  <button type="submit">Send</button>
</form>
<script type="module" src="/dev_chat.mjs"></script>
</html>
