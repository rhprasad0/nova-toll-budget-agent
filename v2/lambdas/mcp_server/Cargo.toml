[package]
name = "mcp_server"
version = "0.2.0"
edition = "2024"
publish = false

# Direct dependencies are pinned to releases at least two weeks old when chosen, except
# rmcp 3.6.0: it fixes advisory GHSA-4432-vg92-fqh6 (unauthenticated memory growth).
[dependencies]
aws-config = "=1.12.0"
aws-credential-types = "=1.3.0"
aws-sigv4 = "=1.6.0"
aws-smithy-types = "=1.9.0"
axum = "=0.8.9"
lambda_http = { version = "=1.3.1", default-features = false, features = ["apigw_http"] }
rmcp = { version = "=3.6.0", features = ["server", "macros", "transport-streamable-http-server"] }
rustls = "=0.23.45"
rustls-pki-types = "=1.15.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "=0.14.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
url = "=2.5.8"

[dev-dependencies]
reqwest = { version = "=0.13.5", features = ["json"] }
tokio = { version = "=1.53.2", features = ["sync"] }

[profile.release]
strip = true
