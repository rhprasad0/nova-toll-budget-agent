[project]
name = "tollchat-pricing-v2"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.70",
    "defusedxml>=0.7.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "strands-agents[openai]>=1.52.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "pyright",
    "pytest",
    "ruff",
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = ["**/__pycache__", ".venv", "infra/build", "lambdas/loader/tests"]

[tool.ruff]
extend-exclude = ["infra/build"]

[tool.ruff.lint]
select = ["ANN", "B", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["ANN"]

[tool.pytest.ini_options]
addopts = '-m "not live"'
markers = ["live: hits the network and RDS; run explicitly with -m live"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["agent_tools"]

[tool.coverage.report]
fail_under = 75
include = ["agent_tools/get_annual_toll_ballpark.py"]
show_missing = true
