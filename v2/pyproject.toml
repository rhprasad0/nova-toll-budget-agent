[project]
name = "tollchat-pricing-v2"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "aws-opentelemetry-distro==0.19.0",
    "opentelemetry-sdk==1.44.0",
    "bedrock-agentcore>=1.21.0,<2",
    "boto3[crt]>=1.43.70",
    "defusedxml>=0.7.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "strands-agents[openai]>=1.52.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "pyright",
    "pytest",
    "pyyaml>=6.0.3",
    "ruff",
    "strands-agents-evals==1.1.0",
    "tiktoken==0.14.0",
    "types-boto3[bedrock-agentcore,bedrock-runtime,ce,cloudwatch,events,iam,logs,rds,s3,ssm,sts]==1.43.72",
]

[tool.pyright]
typeCheckingMode = "strict"
include = [".", "../infra"]
extraPaths = [".", "..", "scripts", "../infra"]
venvPath = "."
venv = ".venv"
executionEnvironments = [
  {root = "lambdas/fetcher", extraPaths = ["lambdas/fetcher", ".", ".."]},
  {root = "lambdas/loader", extraPaths = ["lambdas/loader", ".", ".."]},
  {root = ".", extraPaths = [".", "..", "scripts", "../infra"]},
  {root = "../infra", extraPaths = [".", "..", "scripts", "../infra"]},
]
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = true
exclude = ["**/__pycache__", ".venv", "infra/build", "**/node_modules"]

[tool.ruff]
extend-exclude = ["infra/build"]

[tool.ruff.lint]
select = ["ANN", "B", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = '-m "not live"'
markers = ["live: hits the network and RDS; run explicitly with -m live"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["agent_tools"]

[tool.coverage.report]
fail_under = 75
include = ["agent_tools/get_annual_toll_ballpark.py"]
show_missing = true
