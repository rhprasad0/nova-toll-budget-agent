[project]
name = "tollchat-pricing-v2"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.70",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = ["pyright", "pytest", "ruff"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
exclude = ["**/__pycache__", ".venv", "infra/build", "lambdas/loader/tests"]

[tool.ruff]
extend-exclude = ["infra/build"]

[tool.ruff.lint]
select = ["ANN", "B", "DTZ", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["."]
