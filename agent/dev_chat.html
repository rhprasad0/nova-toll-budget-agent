<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TollChat dev console</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
  body { max-width: 900px; margin: auto; padding: 2rem 1rem; }
  header, form { display: flex; gap: .75rem; align-items: center; } h1 { margin-right: auto; }
  #messages { display: grid; gap: 1rem; margin: 1.5rem 0; } .message { padding: 1rem; border-radius: .6rem; white-space: pre-wrap; }
  .user { background: #1f6feb33; } .assistant { background: #21262d; } .error { color: #ff7b72; }
  textarea { flex: 1; min-height: 4rem; resize: vertical; } button, textarea { font: inherit; padding: .65rem; }
  details { margin-top: .75rem; } pre { overflow: auto; max-height: 24rem; padding: .75rem; background: #010409; }
  .note { color: #8b949e; } button { cursor: pointer; }
</style>
<header><h1>TollChat dev console</h1><button id="reset" type="button">Reset chat</button></header>
<p class="note">Loopback-only. Raw prompts, responses, tool messages, and metrics are stored in <code>.tollchat/telemetry.jsonl</code>.</p>
<main id="messages" aria-live="polite"></main>
<form id="chat"><textarea id="message" required maxlength="8000" placeholder="Price a trip from Dumfries to Westpark"></textarea><button>Send</button></form>
<script>
  const sessionId = sessionStorage.tollchatSessionId ||= crypto.randomUUID();
  const messages = document.querySelector('#messages');
  const form = document.querySelector('#chat');
  const input = document.querySelector('#message');
  const reset = document.querySelector('#reset');
  const add = (role, text, telemetry) => {
    const turn = document.createElement('section'); turn.className = `message ${role}`;
    const label = document.createElement('strong'); label.textContent = role === 'user' ? 'You' : 'TollChat';
    const content = document.createElement('div'); content.textContent = text;
    turn.append(label, content);
    if (telemetry) { const details = document.createElement('details'); const summary = document.createElement('summary'); summary.textContent = 'Raw telemetry'; const trace = document.createElement('pre'); trace.textContent = JSON.stringify(telemetry, null, 2); details.append(summary, trace); turn.append(details); }
    messages.append(turn); turn.scrollIntoView({ block: 'end' });
  };
  const request = async (path, body) => { const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const payload = await response.json(); if (!response.ok) throw new Error(payload.error || 'Request failed'); return payload; };
  form.addEventListener('submit', async event => { event.preventDefault(); const message = input.value.trim(); if (!message) return; add('user', message); input.value = ''; input.disabled = true; form.querySelector('button').disabled = true; try { const payload = await request('/api/chat', { session_id: sessionId, message }); add('assistant', payload.answer, payload.telemetry); } catch (error) { add('assistant error', error.message); } finally { input.disabled = false; form.querySelector('button').disabled = false; input.focus(); } });
  reset.addEventListener('click', async () => { try { await request('/api/reset', { session_id: sessionId }); messages.replaceChildren(); input.focus(); } catch (error) { add('assistant error', error.message); } });
</script>
</html>
